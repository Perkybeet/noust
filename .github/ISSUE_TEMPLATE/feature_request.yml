name: Feature request
description: Something Noust does not do yet, or does in a way that costs you time
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        A request that starts from the job you are trying to do is easier to weigh than one that
        starts from a solution. Please look through the open issues first.

        A question about how to do something belongs in
        [Discussions](https://github.com/Perkybeet/noust/discussions/categories/q-a), and an idea
        you want to talk over before it is a request in
        [Ideas](https://github.com/Perkybeet/noust/discussions/categories/ideas).
  - type: textarea
    id: job
    attributes:
      label: What are you trying to do
      description: The situation, and what you do today instead.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Noust to do
      description: A command, a console screen, a setting. A sketch is enough.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Applications and deploys
        - Databases
        - Domains and certificates
        - Network, DNS and the web server
        - The server (services, monitoring, software, updates)
        - Security, accounts and access
        - Backups and restore
        - Console (the browser)
        - Fleet (a central and its servers)
        - Command line
        - Documentation
        - Installing or updating Noust
        - Recipes (the catalogue)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Noust version you are on
      description: Output of `noust --version`.
