name: CI

on:
  push:
    branches: [main, "refactor/**", "dev/**"]
  pull_request:
    branches: [main]

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keeping the linter and type checker pinned means CI does not turn red
  # because a tool released a new rule overnight.
  RUFF_VERSION: "0.14.4"
  MYPY_VERSION: "1.19.0"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Check lint rules
        run: ruff check src/noust tests scripts

      - name: Check formatting
        run: ruff format --check src/noust tests scripts

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Type checking is the guard that matters most in this codebase: every
      # one of the calls to methods that did not exist, and which shipped for
      # entire releases because a blind except swallowed the AttributeError,
      # is caught here.
      - name: Install project and type checker
        run: |
          pip install -e ".[all,dev]"
          pip install "mypy==${MYPY_VERSION}"

      # Blocks against a committed baseline that can only shrink. Errors that
      # mean "this name does not exist" fail at zero regardless, because they
      # are the reason the gate exists.
      - name: Run mypy
        run: python scripts/typecheck.py

  # "The package is the tag" (docs/reproducible-builds.md): the commit is built twice, in two different
  # directories, with the commit's own time as SOURCE_DATE_EPOCH, and the wheel and the source
  # distribution must be the same bytes. The tools are pinned: the bytes of a wheel depend on the
  # setuptools that wrote it, and a verifier must be able to name the ones to use.
  reproducible:
    name: Reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the pinned build tools
        run: pip install "build==1.6.1" "setuptools==84.0.0" "wheel==0.48.0"

      - name: Build twice and compare
        run: python scripts/reproducible_build.py verify --ref HEAD

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what Ubuntu 26.04 LTS ships, and it is where tarfile
        # tightened addfile(); testing it here is how that surfaced.
        #
        # A push to a working branch tests the oldest and the newest Python
        # only, the two ends where the language actually differs; main and a
        # pull request into it test every version in between as well (a tag
        # is verified again by release.yml before anything is published).
        python-version: ${{ fromJSON(github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && '["3.10", "3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: pip install -e ".[all,dev]"

      # One worker per vCPU: with psutil installed `-n auto` counts physical
      # cores, which on a runner's SMT vCPUs can be half of them. Every test has
      # its own home, store, audit log and temporary directory (conftest.py),
      # so the order and the worker a test lands on do not matter.
      # Coverage is measured on the one version that uploads it, and 3.14 is
      # in the matrix of every run; pytest-cov combines the workers' data.
      - name: Run tests
        if: matrix.python-version != '3.14'
        run: pytest -n logical

      - name: Run tests with coverage
        if: matrix.python-version == '3.14'
        run: pytest -n logical --cov=noust --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # Every other job installs pydantic 2 from pip, so none of them can see a
  # pydantic-1-only failure - and the .deb depends on the distribution
  # package, which on Ubuntu 24.04 and Debian 12 is pydantic 1.10. That is
  # how v1.5.0 imported `field_validator`, a pydantic-2-only name, and
  # `noust web start` died with ImportError on every Ubuntu 24.04 install
  # while this whole workflow stayed green. This job pins pydantic to 1.10
  # and imports and tests the real web layer against it, exercising the
  # bridge in noust.web.pydantic_compat from its v1 side.
  #
  # fastapi is pinned to 0.115, the last line that supports pydantic 1: noble
  # itself ships 0.101, but the test fixtures need starlette's newer
  # TestClient, and the release workflow's container jobs already import the
  # panel against noble's exact versions. What this job guards is the
  # pydantic major, which is where the names differ.
  pydantic-v1:
    name: Panel on pydantic 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the panel with pydantic 1.10
        run: |
          pip install --no-deps -e .
          pip install "pydantic==1.10.*" "fastapi>=0.115,<0.116" "httpx<0.28" \
            jinja2 psutil pyyaml click rich pytest pytest-mock

      - name: Import the real web layer
        run: |
          python - <<'PY'
          import pydantic
          assert pydantic.VERSION.startswith("1."), pydantic.VERSION
          import noust.web.api.router, noust.web.server
          print(f"The web layer imports under pydantic {pydantic.VERSION}")
          PY

      # Every router, not only the ones the tests below reach, and the schema
      # FastAPI builds from all their models: a model only the OpenAPI walk
      # touches fails there, at the first GET of /api/openapi.json.
      - name: Import every API module and build the OpenAPI schema
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import pydantic
          sys.path.insert(0, "scripts")
          import noust.web.api as api
          from export_openapi import _build_schema
          modules = [m.name for m in pkgutil.iter_modules(api.__path__, f"{api.__name__}.")]
          for name in modules:
              importlib.import_module(name)
          schema = _build_schema()
          print(f"{len(modules)} API modules import and {len(schema['paths'])} paths build under pydantic {pydantic.VERSION}")
          PY

      # Endpoints whose models and validators go through the bridge, the
      # error contract every router answers in, sudo mode, the job and app
      # events the console caches as API responses, and the console itself
      # being served on the stack Ubuntu 24.04 actually installs.
      - name: Run the bridged endpoints' tests
        run: |
          pytest -q \
            tests/test_web_backup_schedules.py \
            tests/test_web_cron_api.py \
            tests/test_web_errors.py \
            tests/test_web_sudo.py \
            tests/test_web_events.py \
            tests/test_spa_serving.py

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e ".[all]"

      # Importing every module catches syntax errors, circular imports and
      # missing dependencies in code paths no test happens to reach.
      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import noust

          failed = []
          for mod in pkgutil.walk_packages(noust.__path__, "noust."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {exc.__class__.__name__}: {exc}")
          if failed:
              print("Modules that failed to import:")
              for line in failed:
                  print(f"  {line}")
              sys.exit(1)
          print("All modules import cleanly")
          PY

      - name: Run the CLI
        run: |
          noust --version
          noust --help

  # The console is built by Node but shipped by Python: src/noust/web/static
  # is the committed output of panel/, because OBS packages `git archive
  # HEAD` with no network and never runs Node. This job is the proof that
  # what is committed is what the source produces - the same pattern as the
  # man page and the completions - plus the frontend's own gates: the typed
  # API contract is current, lint, types and unit tests.
  panel:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: panel/.nvmrc
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install exactly the locked dependencies
        run: npm ci

      - name: Check the API types match the exported OpenAPI schema
        run: npm run check:api

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # What the browser must fetch before anything is drawn, held to panel/bundle-budget.json.
      - name: Check the console's weight against its budget
        run: npm run check:bundle

      # `git diff` alone misses a chunk the build created and nobody
      # committed; `git status` sees both that and a deleted one. The whole
      # tree, not only src/noust/web/static: after the rename the build still
      # went to the old package's folder, this check looked where nothing had
      # changed and passed, and the package shipped the console from before.
      - name: Check the committed build matches the source
        working-directory: .
        run: |
          git diff --exit-code --stat
          untracked=$(git status --porcelain)
          if [ -n "$untracked" ]; then
            echo "The committed console build differs from what panel/ produces:"
            echo "$untracked"
            echo "Run 'cd panel && npm run build' and commit src/noust/web/static."
            exit 1
          fi

  # The console against the real backend in a real browser: every page in
  # both themes with axe reporting zero WCAG 2.2 AA violations and zero
  # Content Security Policy violations. A policy is only enforced in a
  # browser, which is how the strict one once shipped and silently switched
  # features off; this job is what makes that impossible now.
  # Split across four machines rather than more workers on one: each worker
  # runs its own backend and browser, and a crowded runner turns the axe and
  # stillness checks into timing flakes. Four shards take the suite from
  # about twenty minutes to about six.
  e2e:
    name: Console end-to-end (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version-file: panel/.nvmrc
          cache: npm
          cache-dependency-path: panel/package-lock.json

      # scripts/console_server.py runs the real FastAPI app on a sandboxed,
      # seeded store with a fake command runner, so nothing here needs root
      # or touches the runner's own systemd.
      - name: Install the project
        run: pip install -e ".[web]"

      - name: Install the console's dependencies
        working-directory: panel
        run: npm ci

      - name: Install the browser
        working-directory: panel
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: panel
        env:
          NOUST_PYTHON: python
        run: npm run e2e -- --shard=${{ matrix.shard }}/4

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            panel/playwright-report
            panel/test-results
          retention-days: 14

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The version used to live in six hand-synchronised files. This is the
      # gate that makes drift impossible rather than merely discouraged.
      - name: Check version consistency
        run: python scripts/release.py --check

      # Every command, alias and option the argparse tree exposed still exists.
      # They are in scripts and in muscle memory, so losing one is a breaking
      # change whether or not anyone meant it.
      - name: Check the command surface
        run: |
          pip install -e ".[all]"
          python scripts/cli_parity.py

      # A recipe competes on trust: no image of a Compose recipe may move. A
      # floating tag, no tag, no digest or an image named by a variable fails
      # here, with every such image listed (Coolify's catalogue has a floating
      # tag in 54% of its templates).
      - name: Lint the recipes
        run: python scripts/recipe_lint.py

      # There used to be two man pages, diverged, fifteen releases stale, and
      # the one shipped in the .deb declared the wrong licence.
      # panel/openapi.json is the one input of the console's generated
      # types; a schema the API no longer produces is a contract the panel
      # was built against that the server has since moved past.
      - name: Check the OpenAPI export is current
        run: python scripts/export_openapi.py --check

      # What a release promised its clients (docs/api.md, "The promise"): an
      # operation that disappears or starts asking for more fails here, and is
      # accepted on purpose in the same change as the code.
      - name: Check the API keeps its compatibility promise
        run: python scripts/api_compat.py

      - name: Check the man page is current
        run: python scripts/generate_man.py --check

      # Committed rather than generated at package build time, so a Click
      # upgrade that changes the shim has to be noticed here.
      - name: Check the completion scripts are current
        run: python scripts/generate_completions.py --check

      # packaging/install.sh cannot import Noust, so it carries a generated copy
      # of the platform table (noust.managers.server.platforms) and docs/PLATFORMS.md
      # shows the same rows: this is the gate that keeps the three equal.
      - name: Check the installer's platform table is current
        run: python scripts/sync_install_targets.py --check

      # The installer is the first thing a new server runs, as root, on whatever
      # shell it has: it must parse in POSIX sh and pass shellcheck as sh.
      - name: Lint the installer
        run: |
          sh -n packaging/install.sh
          shellcheck -s sh packaging/install.sh

      - name: Build the distribution
        run: |
          pip install build twine
          python -m build --outdir dist/noust
          twine check dist/noust/*

  # The Terraform and OpenTofu provider (checklist J-14), Go, in terraform-provider-noust/. Built, vetted and
  # unit-tested (among the tests, the ones that hold its operations table and every request and answer type to
  # panel/openapi.json); applied by terraform-plugin-testing to the real API that scripts/console_server.py
  # serves, with tokens narrowed to the permissions each profile names and never the master token; run under
  # the real Terraform CLI; and the Python client tested against the same live API. The same stages run in
  # containers with `python tests/integration/terraform_run.py`.
  terraform-provider:
    name: Terraform provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-go@v6
        with:
          go-version-file: terraform-provider-noust/go.mod
          cache-dependency-path: terraform-provider-noust/go.sum

      # The wrapper would put its own output around every command the tests read.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.8"
          tofu_wrapper: false

      - name: Install the server the tests run against
        run: pip install -e ".[all]"

      - name: Format, vet, build and unit tests
        run: python tests/integration/terraform_run.py --native --stage unit

      - name: Acceptance tests against the live API
        run: python tests/integration/terraform_run.py --native --stage acceptance

      - name: End to end under the Terraform CLI
        run: python tests/integration/terraform_run.py --native --stage e2e

      # The same plugin protocol, a different engine: what OpenTofu users run.
      - name: End to end under OpenTofu
        run: python tests/integration/terraform_run.py --native --stage e2e-tofu

      - name: The Python client against the live API
        run: python tests/integration/terraform_run.py --native --stage sdk

      # go.mod and go.sum are what a build downloads; the reference under docs/ is what the registry shows.
      # Neither may differ from what the code says.
      - name: Check the module and the generated reference are current
        working-directory: terraform-provider-noust
        run: |
          go mod tidy
          go generate ./...
          if [ -n "$(git status --porcelain -- .)" ]; then
            git status --short -- .
            git diff -- .
            echo "run go mod tidy and go generate ./... in terraform-provider-noust and commit the result"
            exit 1
          fi

  # The documentation site (checklist N-17, N-22): built from docs/ on every push, and the build
  # fails on a link or an anchor that leads nowhere, a Markdown file nobody listed in
  # docs/site.yaml, or a generated reference (the command line, the API, the configuration keys)
  # that no longer matches the code. The site is kept as an artifact for the day the owner decides
  # to publish it; nothing here uploads it anywhere else.
  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the project
        run: pip install -e ".[all]"

      - name: Check the generated references are current
        run: python scripts/generate_reference.py --check

      # The Python client is generated from the same schema the console is typed from; it must be
      # current, and it must pass the strictest type check, as it is what a user's editor will ask.
      - name: Check the Python client is current and type-checks
        run: |
          python scripts/generate_sdk.py --check
          pip install "mypy==${MYPY_VERSION}"
          cd sdk/python && mypy --no-incremental noust_sdk

      - name: Build the site and check every link
        run: python scripts/build_docs.py --out build/docs-site

      # Every picture of the console is recorded with the release it shows and its hash. Pictures
      # of an earlier minor release are a note here and a failure when a tag publishes.
      - name: Check the documentation's pictures are recorded
        run: python scripts/docs_screens.py check

      - uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: build/docs-site
          retention-days: 14

  # The distribution packages from exactly what OBS receives, on every push,
  # not only at the tag: v2.0.0's first tag failed on an RPM gate that branch
  # CI never ran. One Debian and one Fedora release; the Release workflow covers
  # every target.
  packages:
    name: Distribution packages (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "debian:13"
            kind: deb
            install: "apt-get update && apt-get install -y --no-install-recommends devscripts equivs git ca-certificates"
          - image: "fedora:43"
            kind: rpm
            install: "dnf install -y rpm-build python3-devel python3-setuptools python3-pip python3-wheel git tar gzip"
    steps:
      - name: Install only what a build host has
        run: ${{ matrix.install }}

      - uses: actions/checkout@v7

      # --snapshot: a branch between two releases is staged as a pre-release of
      # the last; these packages are built and installed, never published.
      - name: Stage the OBS package
        run: |
          git config --global --add safe.directory "$PWD"
          packaging/obs/stage.sh --snapshot noust /tmp/obs/noust

      - name: Build
        run: |
          if [ "${{ matrix.kind }}" = deb ]; then
            mk-build-deps --install --remove --tool "apt-get -y --no-install-recommends" \
              /tmp/obs/noust/debian.control
          fi
          packaging/obs/build.sh ${{ matrix.kind }} /tmp/obs/noust /tmp/out

      # Without the console's dependencies, as `dnf install noust` leaves a
      # machine: the CLI must not need FastAPI to start.
      - name: Install it and run the command
        run: |
          if [ "${{ matrix.kind }}" = deb ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              /tmp/out/noust_*.deb
          else
            dnf install -y /tmp/out/noust-[0-9]*.noarch.rpm
          fi
          if python3 -c "import fastapi" 2> /dev/null; then
            echo "FastAPI is installed; this step must run without it"; exit 1
          fi
          noust --version
          noust --help > /dev/null
          noust list --help > /dev/null
