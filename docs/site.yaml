          - source: docs/console-keyboard.md
            slug: reference/console/keyboard
            type: reference
            summary: "The console's keyboard shortcuts and the command palette."
          - source: docs/console-accessibility.md
            slug: reference/console/accessibility
            type: reference
            summary: What the console does for keyboard, screen reader and low-vision users, and how it is checked.
      - title: Recipes
        pages:
          - source: docs/recipes-catalog.md
            slug: reference/recipes
