          - source: docs/reference-api.md
            slug: reference/api/operations
            type: reference
            split: 2
            summary: Every operation of the HTTP API with its permission, generated from the OpenAPI schema.
          - source: docs/API-CHANGELOG.md
            slug: reference/api/changes
            type: reference
            summary: Changes to the API, with the breaking ones and the deprecations.
      - title: Configuration
        pages:
          - source: docs/CONFIG.md
            slug: reference/configuration
            type: reference
            summary: What each setting does, and the obsolete ones.
          - source: docs/reference-config.md
            slug: reference/configuration/keys
            type: reference
            summary: Every configuration key with its default, generated from the code.
      - title: The console
        pages:
          - source: docs/console.md
            slug: reference/console
            title: The console, page by page
            type: reference
            summary: "The browser console: how it is laid out, the features that are on or off, live updates and themes, and a page for each of its parts."
          - source: docs/console-start.md
            slug: reference/console/start
            type: reference
            summary: Starting the console, keeping it running, reaching it through a tunnel or on a name of its own, signing in, and sudo mode.
          - source: docs/console-overview.md
            slug: reference/console/overview
            type: reference
            summary: "The server's overview, its map, the charts, the activity and the logs."
          - source: docs/console-fleet.md
            slug: reference/console/fleet
            type: reference
            summary: "A central's own pages: every server side by side, and what each one needs."
          - source: docs/console-applications.md
            slug: reference/console/applications
            type: reference
            summary: "The list of applications, the recipes, one application's pages, the deploy queue, Diagnose, the terminal and cron."
          - source: docs/console-domains.md
            slug: reference/console/domains
            type: reference
            summary: Domains, certificates and the sites Noust did not write.
          - source: docs/console-databases.md
            slug: reference/console/databases
            type: reference
            summary: Engines, databases, their tables, the SQL console, backups and users.
          - source: docs/console-backups.md
            slug: reference/console/backups
