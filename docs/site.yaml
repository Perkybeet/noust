# The documentation: what is published, where, in what order, and what kind of page each one is.
#
# scripts/build_docs.py reads this and the Markdown it lists. `--emit DIR` writes the package a
# website paints (manifest, Markdown with every link resolved, redirects, llms.txt); without it,
# a preview to open from disk. Nothing is published by building either.
#
# The pages are arranged in five tabs, each the answer to one question, and a footer:
#   start      What is Noust, and how do I install it?   (tutorials: a path for someone new)
#   guides     How do I do X?                              (one task per page)
#   concepts   Why does it work this way?                  (explanation, no steps)
#   reference  What is the exact option?                   (lists, generated where possible)
#   releases   What changed, and how do I upgrade?
#   project    Help, contributing, the security policy     (linked from the foot of every page)
#
# Each page has a `type` (tutorial, guide, explanation or reference) and a sentence that says what
# it is for. A route (slug) starts with its tab and does not change: renaming one means an entry
# under `redirects`. The files themselves stay flat in docs/, so GitHub shows them as they are; a
# page cut out of a longer one is a new file listed here. A Markdown file in docs/ must be listed
# or excluded with the reason, so a new page cannot be forgotten.

title: Noust documentation
repository: https://github.com/Perkybeet/noust
branch: main
base: /docs/
summary: >
  Noust deploys web applications on Linux servers you own. It writes the nginx or Apache site, the
  certificate and the systemd unit, builds every deploy as a release that only goes live if it
  answers, and can put the previous one back in seconds. One engine, driven from the command line,
  a browser console and a JSON API. This is its documentation: installing it, deploying with it,
  running it, upgrading it, and every command, endpoint and setting.

# What the landing page of the documentation shows: a promise, the command, three ways in, the
# tasks people come for, and where to look things up. Every slug is checked to be a route.
home:
  promise: Deploy anything on a server you own. A new version only goes live if it answers.
  install:
    command: |
      curl -fsSLO https://github.com/Perkybeet/noust/releases/latest/download/install.sh
      curl -fsSLO https://github.com/Perkybeet/noust/releases/latest/download/SHA256SUMS
      sha256sum -c --ignore-missing SHA256SUMS && sh install.sh
    primary: {title: Deploy your first application, slug: start/first-application}
    secondary: {title: How Noust works, slug: start/how-noust-works}
  paths:
    - title: New to Noust
      text: What it is, how to install it, and a first application from start to finish.
      slug: start/what-is-noust
    - title: Running servers for a team
      text: Several servers from one console, single sign-on, roles, audit and compliance.
      slug: guides/fleet
    - title: Coming from Coolify or Dokploy
      text: Bring an application across with its settings and its data, and move its domain.
      slug: start/move-from-coolify-or-dokploy
  tasks:
    - {title: A domain with HTTPS, slug: start/domain-and-https}
    - {title: A database, slug: start/database}
    - {title: Backups, and getting them back, slug: start/backups}
    - {title: Roll back a bad deploy, slug: start/roll-back}
    - {title: Deploy from CI, slug: guides/ci}
    - {title: A preview for each pull request, slug: guides/previews}
    - {title: Teammates and single sign-on, slug: guides/teams}
    - {title: Several servers, slug: start/add-a-server}
  lookup:
    - {title: Commands, slug: reference/cli}
    - {title: API, slug: reference/api}
    - {title: Settings, slug: reference/configuration/keys}
    - {title: What changed, slug: releases/changelog-4.0}
  trouble:
    title: Something is wrong?
    text: noust diagnose names the most likely cause first. The frequent failures are here, with their messages.
    slug: guides/troubleshooting

tabs:
  - title: Start
    slug: start
    summary: What Noust is, how to install it, and a first application from start to finish.
    groups:
      - title: Introduction
        pages:
          - source: docs/what-is-noust.md
            slug: start/what-is-noust
            type: explanation
            summary: What Noust does for a server you own, what you get, when it fits, and when something else would serve you better.
          - source: docs/concepts.md
            slug: start/how-noust-works
            type: explanation
            summary: What an application is on disk, releases and the health gate, who a build runs as, what Noust does not do, and what stays running if you remove it.
      - title: Install
        pages:
          - source: docs/requirements.md
            slug: start/requirements
            type: reference
            summary: What a server needs to run Noust (memory, processor, disk), and what Noust itself uses when idle.
          - source: docs/install.md
            slug: start/install
            type: guide
            summary: Install Noust with one command, open its console through an SSH tunnel, and create the first administrator.
          - source: docs/PLATFORMS.md
            slug: start/platforms
            type: reference
            summary: The distributions and processors Noust installs on, what is tested where, and how to verify the installer.
          - source: docs/cloud-init.md
            slug: start/cloud-init
            type: guide
            summary: Install and configure Noust on a new server without logging in, from a cloud-init user-data file or Ansible.
      - title: Your first application
        pages:
          - source: docs/first-application.md
            slug: start/first-application
            title: 1. Deploy your first application
            type: tutorial
            summary: An application from a Git repository, built, running behind a health check and answering over HTTPS.
          - source: docs/first-domain.md
            slug: start/domain-and-https
            title: 2. Put it on your domain, with HTTPS
            type: tutorial
            summary: Point a name at the server, check it, add it to the application, send www to it, and get a certificate that renews itself.
          - source: docs/first-database.md
            slug: start/database
            title: 3. Give it a database
            type: tutorial
            summary: A PostgreSQL database with an account of its own, linked as DATABASE_URL, and migrations that run before each version serves.
          - source: docs/first-backup.md
            slug: start/backups
            title: 4. Back it up, and prove the backup comes back
            type: tutorial
            summary: A nightly backup with the databases, an encrypted copy off the server, and a rehearsal that shows it restores.
          - source: docs/first-rollback.md
            slug: start/roll-back
            title: 5. Ship a change, and roll it back
            type: tutorial
            summary: Deploy a new version behind the health check, put the previous one back in seconds, and deploy on every push.
          - source: docs/first-service.md
            slug: start/catalog
            title: 6. Add a service from the catalog
            type: tutorial
            summary: A ready-made application from the catalog, such as a status page, on its own domain, with its secrets and backups.
          - source: docs/first-safety.md
            slug: start/leave-it-alone
            title: 7. Make it safe to leave alone
            type: tutorial
            summary: Notifications that reach you, a second factor on your account, and Noust and the system kept up to date.
      - title: Beyond one server
        pages:
          - source: docs/first-fleet.md
            slug: start/add-a-server
            type: tutorial
            summary: Manage a second server from the console of the first, over an SSH tunnel that gives it no shell.
          - source: docs/first-move.md
            slug: start/move-from-coolify-or-dokploy
            type: tutorial
            summary: Read an application's settings from Coolify or Dokploy, deploy it here with its data, and move its domain without a gap.
      - title: Where next
        pages:
          - source: examples/README.md
            slug: start/examples
            type: reference
            summary: A minimal application for every type Noust deploys, each one deployed for real by the integration harness.
          - source: docs/next-steps.md
            slug: start/next-steps
            type: guide
            summary: Where each next thing is, by what you want to do.

