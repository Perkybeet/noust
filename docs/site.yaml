  - title: Concepts
    slug: concepts
    summary: Why Noust works the way it does. Explanation, no steps.
    groups:
      - title: How it works
        pages:
          - source: docs/how-releases-work.md
            slug: concepts/releases
            type: explanation
            summary: The two layouts, what is on disk, what a deploy does step by step, the health gate, shared paths and how many releases are kept.
          - source: docs/builds-and-accounts.md
            slug: concepts/builds-and-accounts
            type: explanation
            summary: Why a build runs as an unprivileged account in a systemd sandbox, and which account each application runs as.
      - title: Security
        pages:
          - source: docs/threat-model.md
            slug: concepts/threat-model
            type: explanation
            summary: "What Noust defends against and what it does not: processes, builds and hooks, repositories as untrusted input, outbound requests and the files it keeps."
          - source: docs/SECURITY-MODEL.md
            slug: concepts/promises
            type: reference
            summary: The promises Noust makes about itself, how each can be checked, and the failure each one prevents.
          - source: docs/PRIVACY.md
            slug: concepts/privacy
            type: explanation
            summary: What Noust sends off a server (nothing about you), the one request it makes unasked, and how to check it.
      - title: Several servers
        pages:
          - source: docs/fleet-model.md
            slug: concepts/fleet
            type: explanation
            summary: How far a central may go on each server, decided by the server, and what a fleet is not.

  - title: Reference
    slug: reference
