          - source: docs/dokploy.md
            slug: guides/from-dokploy
            type: guide
            summary: From Dokploy to Noust, a map of concepts and screens, what is not done by design, the importer and the converter of its templates.
          - source: docs/caprover.md
            slug: guides/from-caprover
            type: guide
