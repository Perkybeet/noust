# WASM Default Configuration
# Location: /etc/wasm/config.yaml

# Directory where applications are deployed
apps_directory: /var/www/apps

# Default web server (nginx or apache)
webserver: nginx

# User for running services
service_user: www-data

# SSL configuration
ssl:
  enabled: true
  provider: certbot
  email: ""

# Every setting, with its meaning, is in docs/CONFIG.md; 'noust config show'
# prints what is in effect. The 'logging', 'nodejs' and 'python' sections this
# file used to carry were never read by anything.

# =============================================================================
# Process Monitor Configuration
# =============================================================================
# The charts' history, recorded every 5 seconds by the noust-monitor service
# (the package enables it; 'noust monitor status' says whether it is recording).
# The finer tiers are fixed: 5 s for 2 hours, 1 minute for 26 hours, 10 minutes
# for 8 days. The hourly tier is kept this many days (35 to 3650).

metrics:
  retention_days: 400

# The process monitor records machine metrics, processes over a resource
# threshold or carrying a known malware name, and the state of watched units,
# and notifies you. It never signals a process or deletes a file.
#
# Requires psutil (python3-psutil).

monitor:
  # Enable/disable the monitor (default: false)
  enabled: false
  
  # How often to scan processes (in seconds)
  # Default: 3600 (1 hour)
  scan_interval: 3600
  
  # Resource thresholds that trigger additional scrutiny
  cpu_threshold: 80.0      # Processes using more than this % CPU
  memory_threshold: 80.0   # Processes using more than this % memory
  
  # Monitor log file
  log_file: /var/log/wasm/monitor.log
  
  # SMTP Configuration for Email Notifications
  # Sends alerts when threats are detected and after mitigation
  smtp:
    host: ""                 # SMTP server hostname (e.g., smtp.ionos.es)
    port: 465                # SMTP port (465 for SSL, 587 for TLS)
    username: ""             # SMTP username (usually your email)
    password: ""             # SMTP password
    use_ssl: true            # Use SSL/TLS connection
    use_tls: false           # Use STARTTLS (if use_ssl is false)
    from_address: ""         # From address (defaults to username)
  
  # List of email addresses to receive alerts
  email_recipients: []
  # Example:
  # email_recipients:
  #   - admin@example.com
  #   - security@example.com
