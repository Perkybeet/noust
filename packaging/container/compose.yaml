# The Noust central on a NAS (UGREEN UGOS Pro, Synology, TrueNAS) or any
# Docker host. The full guide: docs/CENTRAL.md
# (https://github.com/Perkybeet/noust/blob/main/docs/CENTRAL.md).
#
# On UGOS Pro: Docker > Project > Create, name it "noust", paste this file,
# Deploy. Anywhere else: `docker compose up -d` next to this file.
#
# FIRST START
#   The first start prints the console's sign-in token, once, and never
#   again (only its hash is kept):
#     docker logs noust            (UGOS Pro: Container > noust > Log)
#   Open https://<the NAS address>:8443. The certificate is self-signed until
#   you mount your own (NOUST_TLS_CERT below), so the browser asks once;
#   `docker logs noust` shows its SHA-256 fingerprint to compare with.
#   Lost the token? docker exec -it noust noust web token --new
#
# TWO-FACTOR
#   Turn it on in the console's settings (or: docker exec -it noust noust 2fa
#   enroll). A central refuses to add its first server without it.
#
# ADDING A SERVER
#   In the console: Settings > Servers > Add. The central prints a command to
#   run ON THE SERVER (where you are already root); the server answers with a
#   join code you paste back. The central's key can only open a tunnel to the
#   server's console: it never gets a shell there.
#
# SEALING (recommended on a NAS)
#   docker exec -it noust noust central seal
#   encrypts every key and token under a passphrase. After each restart the
#   central is locked until you unlock it in the console or with
#   docker exec -it noust noust central unlock
#   Nobody can recover a lost passphrase.
#
# BACKUPS
#   Back up the whole volume (/data). Stop the container first, or copy
#   while it runs and accept that the last minute may be missing.
#
# THE COPIES OF YOUR SERVERS
#   The central can take the backups of the servers it manages, through the
#   tunnel it already has to each one (console > Backups > Destinations >
#   "The central", or: docker exec -it noust noust fleet collect enable).
#   Nothing is opened on your router. They land in /data/backups/.collected,
#   one folder per server, and they can be large: put /data/backups on a disk
#   or a NAS folder of its own (the second volume below) and keep an eye on
#   its room in the console. Nothing is deleted to make room; the central
#   stops taking copies, and says so, while less than "min free" is left.
#   It is ONE copy, on the NAS: add a destination outside it as well.
#
# DEPLOYING ON THIS MACHINE
#   The image carries Docker's command line and Compose, and can deploy
#   containers on the NAS's own Docker, but only when it is asked twice, on
#   purpose: the machine's Docker socket mounted into it, and
#   NOUST_DEPLOY_HERE=containers. That gives the central the power of root on
#   the NAS, so it is off in this file and the console cannot turn it on. The
#   guide, with the compose file that asks for it: docs/central-deploy-here.md
#
# The central only dials out (SSH to each server it manages); nothing needs
# opening on your router. Keep it that way: do not forward 8443 to the
# internet. The console only answers loopback and the private networks
# unless NOUST_ALLOW_IP says otherwise.

services:
  noust:
    # scripts/release.py keeps this tag in step with the release; `latest`
    # follows every release if you prefer.
    image: ghcr.io/perkybeet/noust:4.2.1
    container_name: noust
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      # A named volume Docker creates with the right owner (uid 10001).
      - noust-data:/data
      # Or a folder on the NAS, which must belong to uid 10001 first:
      #   sudo mkdir -p /volume1/docker/noust && sudo chown 10001:10001 /volume1/docker/noust
      # - /volume1/docker/noust:/data
      # The copies taken from your servers, on a disk of their own (it must
      # belong to uid 10001 as well):
      #   sudo mkdir -p /volume1/docker/noust-copies && sudo chown 10001:10001 /volume1/docker/noust-copies
      # - /volume1/docker/noust-copies:/data/backups
    environment:
      # Who may open the console, space-separated addresses or networks.
      # Default: loopback, 10/8, 172.16/12, 192.168/16 and fc00::/7.
      # NOUST_ALLOW_IP: "192.168.1.0/24"
      # Your own certificate instead of the self-signed one (put both files
      # on the volume):
      # NOUST_TLS_CERT: /data/tls/mine.crt
      # NOUST_TLS_KEY: /data/tls/mine.key
      # Your time zone, for the timestamps in the console and the logs.
      TZ: UTC
    # Nothing in the container needs more than this: an unprivileged user, no
    # capabilities, no privilege escalation, and nothing writable outside
    # /data and a small /tmp.
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s

volumes:
  noust-data:
