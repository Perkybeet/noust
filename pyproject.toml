[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noust"
version = "3.2.1"
description = "Noust - deploy and manage web applications on Linux servers"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Yago López Prado", email = "yago.lopez.adeje@gmail.com" }
]
keywords = [
    "noust",
    "wasm",
    "cli",
    "deployment",
    "nginx",
    "apache",
    "systemd",
    "web-apps",
    "server-management",
    "certbot",
    "ssl",
    "releases",
    "rollback",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    # Click 8.0's API, so one codebase works against the 8.1.6 in Ubuntu 24.04
    # and the 8.4 in Tumbleweed without branching. On Linux it has no runtime
    # dependency of its own, which is why it was chosen over Typer: Typer needs
    # annotated-doc, which is packaged on none of the distributions WASM builds
    # for.
    "click>=8.0",
    "Jinja2>=3.1.0",
    "PyYAML>=6.0",
    # Prompts and tables. Packaged everywhere WASM builds, unlike inquirer,
    # which does not exist in Debian or Ubuntu and so gated interactive mode
    # behind a package those users could never install.
    "questionary>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-mock>=3.12",
    "syrupy>=4.6",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
]
monitor = [
    "psutil>=5.9.0",
    "httpx>=0.25.0",
]
web = [
    "fastapi>=0.109.0",
    # Imported directly for HTTPConnection, which covers both HTTP requests and
    # WebSocket handshakes in the security middleware. FastAPI happens to pull
    # it in, but relying on a transitive dependency is how a working install
    # breaks on an unrelated upgrade.
    "starlette>=0.36.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.27.0",
    "psutil>=5.9.0",
    # A central's proxy to its nodes: HTTP through each node's tunnel, and
    # the node's WebSockets (logs, jobs) relayed to the console. websockets
    # also arrives with uvicorn[standard], for the server side; the client
    # side is imported directly, so it is declared.
    "httpx>=0.25.0",
    "websockets>=10.4",
    # Passkeys: the signature check of a WebAuthn assertion (the protocol is
    # Noust's own). Imported only when a passkey is verified; 3.4 is Ubuntu
    # 22.04's, the oldest a target packages.
    "cryptography>=3.4",
]
all = [
    "psutil>=5.9.0",
    "httpx>=0.25.0",
    "fastapi>=0.109.0",
    "starlette>=0.36.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=10.4",
    "cryptography>=3.4",
]

[project.scripts]
noust = "noust.cli.app:entrypoint"
# The name WASM had until 3.0. Kept for the whole 3.x series so no operator
# script or cron line breaks on the upgrade.
wasm = "noust.cli.app:entrypoint"

[project.urls]
Homepage = "https://github.com/Perkybeet/noust"
Documentation = "https://github.com/Perkybeet/noust#readme"
Repository = "https://github.com/Perkybeet/noust.git"
"Bug Tracker" = "https://github.com/Perkybeet/noust/issues"
Changelog = "https://github.com/Perkybeet/noust/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["noust*"]

[tool.setuptools.package-data]
noust = [
    # nginx, apache and systemd unit templates.
    "templates/**/*.j2",
    # Recipes (2.3): the recipe files, and the files they write into an
    # application (wp-config.php, n8n's package.json).
    "recipes/*.yaml",
    "recipes/assets/**/*",
    # Committed, not generated: see src/noust/completions/README.md.
    "completions/*",
    # The console: the committed Vite build of panel/ (index.html, the
    # favicon and every hashed chunk, font and stylesheet under assets/). All
    # of it has to ship, because OBS never runs Node and the console fetches
    # nothing from the network.
    "web/static/**/*",
    # The email's wordmark, a PNG attached inline (core/notifications/render/email.py).
    "core/notifications/assets/*.png",
    "py.typed",
]

[tool.mypy]
python_version = "3.10"
files = ["src/noust"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "build",
    "dist",
    ".venv",
]

# Third-party packages without type information. Listed one by one rather than
# with a blanket ignore_missing_imports, so a new untyped dependency is a
# deliberate decision instead of a silent one.
[[tool.mypy.overrides]]
module = [
    "questionary.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning:noust.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit: this project runs as root
    "BLE",  # flake8-blind-except: the defect class that hid five broken methods
    "T20",  # flake8-print: output goes through the presenter, not print()
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length is handled by the formatter
    "S603",   # subprocess call: the runner is the audited seam for this
    "S607",   # partial executable path: PATH lookup is intended for system tools
    "S310",   # urlopen: every call site validates the scheme before opening
    "RUF012", # ClassVar annotations on config tables add noise without safety
    "RUF059", # an unused element of an unpacked tuple is usually clearer named
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on things bandit dislikes and print freely.
"tests/**" = ["S101", "S105", "S106", "S108", "T20", "BLE"]
# The release script is a developer tool, not shipped code.
"scripts/**" = ["T20"]
# Depends(), Query() and Field() in a signature default are how FastAPI is
# written; B008 exists for the mutable-default trap, which these are not.
"src/noust/web/api/**" = ["B008"]
"src/noust/web/views/**" = ["B008"]
# The CLI is the presentation layer, so this is where output legitimately
# happens. It should still go through the logger rather than bare print, and
# tests/test_architecture.py ratchets the count down.
"src/noust/cli/**" = ["T20", "BLE001", "S110"]
# Blind excepts left in the managers and deployers. Down from 302; the count is
# ratcheted in tests/test_architecture.py so it can only fall.
"src/noust/managers/**" = ["BLE001", "S110"]
"src/noust/deployers/**" = ["BLE001", "S110"]
"src/noust/monitor/**" = ["BLE001", "S110"]
"src/noust/core/**" = ["BLE001", "S110"]
"src/noust/web/**" = ["BLE001", "S110"]
"src/noust/validators/**" = ["BLE001", "S110"]
# The store builds statements from column names it owns; every value is bound
# as a parameter. S608 cannot tell the difference.
"src/noust/core/store.py" = ["S608"]
# The version is read before the re-exports so a broken optional import cannot
# stop `wasm --version` from answering.
"src/noust/__init__.py" = ["E402"]
# Startup banner and update notice: the one place output precedes the logger.
"src/noust/core/update_checker.py" = ["T201"]
"src/noust/web/server.py" = ["T201", "S104"]
