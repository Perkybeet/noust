# Alexandrie: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/alexandrie.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: alexandrie
kind: compose
title: "Alexandrie"
slogan: "A powerful Markdown workspace designed for speed, clarity, and creativity."
description: "Markdown note-taking app focused on performance, local data, and knowledge graph navigation."
category: productivity
tags: [note-taking, markdown, knowledge-management, personal-wiki, productivity]
logo: logo.svg
version: "8.14.2"
revision: 1
updated: 2026-10-30
homepage: https://alexandrie-hub.fr
docs: https://github.com/Smaug6739/Alexandrie/tree/main/docs
repository: https://github.com/Smaug6739/Alexandrie
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_FRONTEND:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_URL_BACKEND:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_URL_RUSTFS:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_PASSWORD_JWT:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for jwt."
  SERVICE_USER_MYSQL:
    generate: "user"
    description: "The user name Noust generated for mysql."
  SERVICE_PASSWORD_MYSQL:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for mysql."
  SERVICE_USER_RUSTFS:
    generate: "user"
    description: "The user name Noust generated for rustfs."
  SERVICE_PASSWORD_RUSTFS:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for rustfs."
  SERVICE_PASSWORD_MYSQLROOT:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for mysqlroot."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    frontend:
      image: ghcr.io/smaug6739/alexandrie-frontend:v8.14.2@sha256:6258f0de269145d60982444415ab2a03631935934c0e3845ce5df2c2d3b68c6f
      environment:
        SERVICE_URL_FRONTEND: ${SERVICE_URL_FRONTEND}
        PORT: '8200'
        NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: ${CONFIG_DISABLE_SIGNUP:-false}
        NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: ${CONFIG_DISABLE_LANDING:-false}
        NUXT_PUBLIC_BASE_API: ${SERVICE_URL_BACKEND}
        NUXT_PUBLIC_BASE_CDN: ${SERVICE_URL_RUSTFS}
        NUXT_PUBLIC_CDN_ENDPOINT: ${CDN_ENDPOINT:-/alexandrie/}
        NUXT_PUBLIC_BASE_URL: ${SERVICE_URL_FRONTEND}
      depends_on:
        backend:
          condition: service_started
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:8200
    backend:
      image: ghcr.io/smaug6739/alexandrie-backend:v8.14.2@sha256:98dc218ea95645c57616f4af6f5af16bb70e8ef02da2963020d0eece901e3a18
      environment:
        SERVICE_URL_BACKEND: ${SERVICE_URL_BACKEND}
        BACKEND_PORT: '8201'
        GIN_MODE: release
        JWT_SECRET: ${SERVICE_PASSWORD_JWT}
        COOKIE_DOMAIN: ${SERVICE_URL_FRONTEND}
        FRONTEND_URL: ${SERVICE_URL_FRONTEND}
        ALLOW_UNSECURE: ${ALLOW_UNSECURE:-false}
        DATABASE_HOST: mysql
        DATABASE_PORT: '3306'
        DATABASE_NAME: ${MYSQL_DATABASE:-alexandrie-db}
        DATABASE_USER: ${SERVICE_USER_MYSQL}
        DATABASE_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
        MINIO_ENDPOINT: rustfs:9000
        MINIO_PUBLIC_URL: ${SERVICE_URL_RUSTFS}
        MINIO_SECURE: ${MINIO_SECURE:-false}
        MINIO_ACCESSKEY: ${SERVICE_USER_RUSTFS}
        MINIO_SECRETKEY: ${SERVICE_PASSWORD_RUSTFS}
        MINIO_BUCKET: ${MINIO_BUCKET:-alexandrie}
        SMTP_HOST: ${SMTP_HOST:-}
        SMTP_MAIL: ${SMTP_MAIL:-}
        SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      depends_on:
        mysql:
          condition: service_healthy
        rustfs:
          condition: service_healthy
      restart: unless-stopped
    mysql:
      image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
      environment:
        MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
        MYSQL_USER: ${SERVICE_USER_MYSQL}
        MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
        MYSQL_DATABASE: ${MYSQL_DATABASE:-alexandrie-db}
      volumes:
        - mysql-data:/var/lib/mysql
      healthcheck:
        test:
          - CMD
          - mysqladmin
          - ping
          - -h
          - localhost
          - -u
          - root
          - -p${SERVICE_PASSWORD_MYSQLROOT}
        timeout: 5s
        interval: 10s
        retries: 5
      restart: unless-stopped
    rustfs:
      image: rustfs/rustfs:1.0.0-beta.8@sha256:fa19210ac4697c79d7ccca1ec9b0eb91aebacc6691991ffb14014bb3c67e6cc3
      environment:
        SERVICE_URL_RUSTFS: ${SERVICE_URL_RUSTFS}
        RUSTFS_ACCESS_KEY: ${SERVICE_USER_RUSTFS}
        RUSTFS_SECRET_KEY: ${SERVICE_PASSWORD_RUSTFS}
        RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-false}
        RUSTFS_LOG_LEVEL: ${RUSTFS_LOG_LEVEL:-info}
      volumes:
        - rustfs-data:/data
        - rustfs-logs:/logs
      healthcheck:
        test:
          - CMD-SHELL
          - nc -z localhost 9000 || exit 1
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped
  volumes:
    mysql-data:
    rustfs-data:
    rustfs-logs:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_PASSWORD_JWT and SERVICE_USER_MYSQL and SERVICE_PASSWORD_MYSQL and SERVICE_USER_RUSTFS and SERVICE_PASSWORD_RUSTFS and SERVICE_PASSWORD_MYSQLROOT in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volumes mysql-data, rustfs-data, rustfs-logs of this application: back them up before updating."
