# Glance reads this file from /app/config/glance.yml and reloads it when it changes.
# ${NAME} is replaced by the container's environment variable of that name.
# Documentation: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
auth:
  secret-key: ${GLANCE_SECRET_KEY}
  users:
    ${GLANCE_USER}:
      password: ${GLANCE_PASSWORD}

theme:
  background-color: 240 13 14
  primary-color: 51 33 68
  contrast-multiplier: 1.2

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: rss
            title: Reading
            limit: 10
            collapse-after: 3
            cache: 3h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
              - url: https://ciechanow.ski/atom.xml
              - url: https://www.joshwcomeau.com/rss.xml
                title: Josh Comeau
              - url: https://samwho.dev/rss.xml

      - size: full
        widgets:
          - type: hacker-news
            limit: 15
            collapse-after: 5

          - type: reddit
            subreddit: selfhosted
            show-thumbnails: false

      - size: small
        widgets:
          - type: weather
            location: London, United Kingdom
            units: metric
            hour-format: 24h

          - type: bookmarks
            title: Links
            links:
              - title: Glance documentation
                url: https://github.com/glanceapp/glance/tree/main/docs
              - title: Noust
                url: https://github.com/Perkybeet/noust
