# BabyBuddy: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/babybuddy.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: babybuddy
kind: compose
title: "BabyBuddy"
slogan: "It helps parents track their baby's daily activities, growth, and health with ease."
description: "BabyBuddy is a comprehensive, user-friendly platform designed to help parents and caregivers manage essential details about their child's growth and development. It provides tools for tracking feedings, sleep schedules, diaper changes, and milestones."
category: analytics
tags: [baby, parents, health, growth, activities, parenting, tracking, family]
logo: logo.svg
version: "2.11.0"
revision: 1
updated: 2026-10-28
homepage: https://github.com/babybuddy/babybuddy
docs: https://docs.baby-buddy.net
repository: https://github.com/babybuddy/babybuddy
license: BSD-2-Clause
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_BABYBUDDY:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    babybuddy:
      image: lscr.io/linuxserver/babybuddy:2.11.0@sha256:3f244c1a3cd06696c2e8edb40f9fda71a837a77fee06f2f5c2f96ac99c135071
      environment:
        SERVICE_URL_BABYBUDDY: ${SERVICE_URL_BABYBUDDY}
        PUID: '1000'
        PGID: '1000'
        TZ: Europe/Madrid
        CSRF_TRUSTED_ORIGINS: ${SERVICE_URL_BABYBUDDY}
      volumes:
        - babybuddy-config:/config
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:8000
        interval: 2s
        timeout: 10s
        retries: 15
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:8000
  volumes:
    babybuddy-config:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume babybuddy-config of this application: back it up before updating."
