# Cinny from the image the project publishes (ghcr.io/cinnyapp/cinny), as its container instructions document (github.com/cinnyapp/cinny, Self-hosting); the list of homeservers it offers is its default one.
schema: 2
name: cinny
kind: compose
title: "Cinny"
slogan: "A simple, elegant and secure Matrix client."
description: "A Matrix web client with a calm interface: rooms, direct messages, spaces and end-to-end encryption, to use with any Matrix homeserver. It is the client only; it keeps no chats of its own."
category: communication
tags: [matrix, chat, client, e2ee]
logo: simple-icons:cinny
version: "4.12.8"
revision: 1
updated: 2026-10-30
homepage: https://cinny.in
docs: https://cinny.in
repository: https://github.com/cinnyapp/cinny
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
health: {path: /, expect: "200-399", timeout: 120}
compose: |
  services:
    cinny:
      image: ghcr.io/cinnyapp/cinny:v4.12.8@sha256:e78446681ad5eb68c10dd7c38e2811ff86514c378d0568dcf9bb1a7aabf0cfde
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:80
notes:
  - "Open {{ url }}. Pick a homeserver (yours, if you run Matrix Synapse from the catalogue) and sign in. Nothing is stored on this server."
