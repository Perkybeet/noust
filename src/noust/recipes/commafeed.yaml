# CommaFeed: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/commafeed
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: commafeed
kind: compose
title: "CommaFeed"
slogan: "Google Reader inspired self-hosted personal RSS reader."
description: "CommaFeed is an open-source feed reader and news aggregator, designed to be lightweight and extensible, with PostgreSQL as its database."
category: utilities
tags: [feed-reader, news-aggregator, rss, utilities]
logo: logo.svg
version: "7.4.1-h2"
revision: 1
updated: 2026-10-28
homepage: https://www.commafeed.com
docs: https://github.com/Athou/commafeed/wiki
repository: https://github.com/Athou/commafeed
license: Apache-2.0
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    commafeed:
      image: athou/commafeed:7.4.1-h2@sha256:59b59cf87cc2ab4501dfbd05079db77b0e0a3454bd17974fb733431d866223ee
      restart: unless-stopped
      volumes:
        - commafeed-commafeed-data:/commafeed/data
      ports:
        - 127.0.0.1:${PORT}:8082
  volumes:
    commafeed-commafeed-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume commafeed-commafeed-data of this application: back it up before updating."
