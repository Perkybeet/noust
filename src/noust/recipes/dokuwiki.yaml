# DokuWiki: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/dokuwiki.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: dokuwiki
kind: compose
title: "DokuWiki"
slogan: "A lightweight and easy-to-use wiki platform for creating and managing documentation and..."
description: "A simple to use and highly versatile Open Source wiki software that doesn't require a database."
category: productivity
tags: [wiki, documentation, knowledge, base, productivity]
logo: logo.svg
version: "2021.11.28"
revision: 1
updated: 2026-10-28
homepage: https://github.com/dokuwiki/dokuwiki
docs: https://www.dokuwiki.org/
repository: https://github.com/dokuwiki/dokuwiki
license: GPL-2.0-only
architectures: ["amd64", "arm", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_DOKUWIKI:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    dokuwiki:
      image: lscr.io/linuxserver/dokuwiki:2021.11.28@sha256:441a75ea0a697391a0b087fe8e0bb317b4cbe54c989625ec5baf9d5d676926bb
      environment:
        SERVICE_URL_DOKUWIKI: ${SERVICE_URL_DOKUWIKI}
        PUID: '1000'
        PGID: '1000'
        TZ: Europe/Madrid
      volumes:
        - dokuwiki-config:/config
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80
        interval: 2s
        timeout: 10s
        retries: 15
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:80
  volumes:
    dokuwiki-config:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume dokuwiki-config of this application: back it up before updating."
