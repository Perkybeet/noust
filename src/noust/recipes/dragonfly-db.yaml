# Dragonfly: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/dragonfly-db
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
# Licence: LICENSE.md of dragonflydb/dragonfly, read 2026-10-30: BSL 1.1 whose grant allows use in your own product, not as an in-memory data store product or as a service
schema: 2
name: dragonfly-db
kind: compose
title: "Dragonfly"
slogan: "A modern replacement for Redis and Memcached"
description: "Source-available (Business Source License 1.1), for your own use. Dragonfly is a drop-in Redis replacement that is designed for heavy data workloads running on modern cloud hardware."
category: data
tags: [database, redis, data]
logo: logo.svg
version: "2.0.2"
revision: 1
updated: 2026-10-31
homepage: https://www.dragonflydb.io/
docs: https://www.dragonflydb.io/docs
repository: https://github.com/dragonflydb/dragonfly
license: BUSL-1.1
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  DFLY_requirepass:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for dfly requirepass."
health: {path: /healthz, expect: "200-399", timeout: 180}
compose: |
  services:
    dragonflydb:
      image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2@sha256:061f00b201b58e12f974e4e96c761a881ee1c05e9d8ee967466a604b7299753b
      ulimits:
        memlock: -1
      volumes:
        - dragonflydata:/data
      environment:
        DFLY_requirepass: ${DFLY_requirepass}
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:6379
  volumes:
    dragonflydata:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume dragonflydata of this application: back it up before updating."
