# diagrams.net (draw.io) from the image the project publishes (jgraph/drawio on Docker Hub), run
# as its README describes (github.com/jgraph/docker-drawio): a Tomcat serving the editor on 8080,
# with no state of its own. Diagrams are saved by the browser to its own storage, to a device or
# to a service you connect (Google Drive, OneDrive, GitHub, GitLab), never on this server, so
# there is no volume to back up and no account. The editor answers / without a sign-in.
#
# Pinned to the release tag and to the digest Docker Hub serves for it.
schema: 2
name: drawio
kind: compose
title: draw.io
slogan: "A diagramming editor for flowcharts, UML, networks and more, in the browser."
description: "The diagrams.net editor served from your own server: flowcharts, UML, network and cloud architecture diagrams with large shape libraries, saved to your device or to a storage service you connect. It keeps nothing on the server and has no sign-in: anybody who reaches it can use the editor."
category: productivity
tags: [diagrams, whiteboard, uml, flowchart]
logo: logo.svg
version: "32.5.5"
revision: 1
updated: 2026-10-20
homepage: https://www.drawio.com
docs: https://www.drawio.com/doc/
repository: https://github.com/jgraph/drawio
license: Apache-2.0
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 8580
health:
  path: /
  expect: "200"
  timeout: 120
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    drawio:
      image: jgraph/drawio:32.5.5@sha256:16296fe9fd09eff92a3808cc674ce1883712c1b0bae5d48ccc30f9abf13c578b
      restart: unless-stopped
      ports:
        - "127.0.0.1:${PORT}:8080"
notes:
  - "Open {{ url }}: the editor needs no account, and anybody who reaches it can use it. Keep the address to people you trust, or put access control in front of it."
  - "Nothing is stored on this server: a diagram is saved where you choose when you save it (your device, or a service you connect), so there is nothing here to back up."
