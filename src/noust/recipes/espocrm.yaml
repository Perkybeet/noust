# EspoCRM from the image the project publishes (espocrm/espocrm on Docker Hub, the Apache build)
# with MariaDB and the daemon the project's compose file runs, as its installation guide describes
# (docs.espocrm.com "Installation with Docker", read 2026-10-20): ESPOCRM_DATABASE_* for the
# database, ESPOCRM_ADMIN_USERNAME and ESPOCRM_ADMIN_PASSWORD (the administrator, made by the
# installation on the first start, so no visitor can claim it), ESPOCRM_SITE_URL, and the three
# directories of EspoCRM 10 that hold what is yours (data, custom, client/custom) as volumes shared with
# the daemon (the same image, started as docker-daemon.sh, which runs scheduled jobs, workflows and
# e-mail; it exits until the installation is done, so it waits for the check the image itself uses,
# `bin/command app-check`, instead of restarting). /var/www/html itself is not mounted: with it mounted the image takes the installation
# for a legacy one, installs nothing and sends every request to the web installer. The WebSocket
# service of the project's file is left out: live updates are optional.
#
# Pinned to the release tag and to the digests Docker Hub serves for it.
schema: 2
name: espocrm
kind: compose
title: EspoCRM
slogan: "A customer relationship manager for sales, marketing and support."
description: "Track leads, accounts, opportunities, cases and campaigns, with workflows, reports, e-mail integration and a calendar. A full CRM for a small team. Starts with the administrator you name."
category: business
tags: [crm, sales, support, marketing]
logo: logo.svg
version: "10.0.10"
revision: 1
updated: 2026-10-20
homepage: https://www.espocrm.com
docs: https://docs.espocrm.com
repository: https://github.com/espocrm/espocrm
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 8980
variables:
  ESPOCRM_SITE_URL:
    from: url
    description: The address people use; EspoCRM builds its links from it.
  ESPOCRM_ADMIN_USERNAME:
    default: admin
    description: The administrator's user name.
  ESPOCRM_ADMIN_PASSWORD:
    generate: password32
    description: The administrator's password. EspoCRM reads it only when it installs.
  DB_PASSWORD:
    generate: password32
    description: The password of the stack's MariaDB account.
  MARIADB_ROOT_PASSWORD:
    generate: password32
    description: The password of the MariaDB root account, which stays inside the stack.
health:
  path: /
  expect: "200"
  timeout: 600
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    espocrm:
      image: espocrm/espocrm:10.0.10-apache@sha256:debf48652fed511424825839185fd67e773081ee0d665ab62cbce985acb32636
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      environment:
        ESPOCRM_DATABASE_PLATFORM: Mysql
        ESPOCRM_DATABASE_HOST: db
        ESPOCRM_DATABASE_NAME: espocrm
        ESPOCRM_DATABASE_USER: espocrm
        ESPOCRM_DATABASE_PASSWORD: "${DB_PASSWORD}"
        ESPOCRM_ADMIN_USERNAME: "${ESPOCRM_ADMIN_USERNAME}"
        ESPOCRM_ADMIN_PASSWORD: "${ESPOCRM_ADMIN_PASSWORD}"
        ESPOCRM_SITE_URL: "${ESPOCRM_SITE_URL}"
      healthcheck:
        test: ["CMD-SHELL", "cd /var/www/html && bin/command app-check >/dev/null 2>&1"]
        interval: 15s
        timeout: 10s
        retries: 40
        start_period: 30s
      volumes:
        - espocrm-custom:/var/www/html/custom
        - espocrm-data:/var/www/html/data
        - espocrm-client-custom:/var/www/html/client/custom
      ports:
        - "127.0.0.1:${PORT}:80"
    daemon:
      image: espocrm/espocrm:10.0.10-apache@sha256:debf48652fed511424825839185fd67e773081ee0d665ab62cbce985acb32636
      restart: unless-stopped
      entrypoint: docker-daemon.sh
      depends_on:
        espocrm:
          condition: service_healthy
      volumes:
        - espocrm-custom:/var/www/html/custom
        - espocrm-data:/var/www/html/data
        - espocrm-client-custom:/var/www/html/client/custom
    db:
      image: mariadb:11.8.9@sha256:f16d7a344413e519dff518f27bdb221388f84b0d274c97c4fb5f2cb0dc1b34fa
      restart: unless-stopped
      environment:
        MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
        MARIADB_DATABASE: espocrm
        MARIADB_USER: espocrm
        MARIADB_PASSWORD: "${DB_PASSWORD}"
      healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s
      volumes:
        - espocrm-db:/var/lib/mysql
  volumes:
    espocrm-custom:
    espocrm-data:
    espocrm-client-custom:
    espocrm-db:
notes:
  - "The first start installs EspoCRM, which takes a few minutes. Then sign in at {{ url }} as {{ vars.ESPOCRM_ADMIN_USERNAME }}; the password is ESPOCRM_ADMIN_PASSWORD (noust env show {{ domain }} --unmask). It is read only when EspoCRM installs: change it in EspoCRM afterwards."
  - "Its configuration and uploads are in the Docker volume espocrm-data, your extensions and customisations in espocrm-custom and espocrm-client-custom, and the database in espocrm-db (MariaDB, dumped by Noust before every update). Back them up before updating: the uploaded files are not in the database dump."
