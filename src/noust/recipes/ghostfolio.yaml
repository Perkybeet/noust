# Ghostfolio from the image the project publishes (ghostfolio/ghostfolio on Docker Hub) with the
# PostgreSQL and the Redis-compatible store (Valkey, run with a password) its self-hosting guide
# asks for (github.com/ghostfolio/ghostfolio, "Self-hosting > Run with Docker" and
# docker/docker-compose.yml, read 2026-10-20): DATABASE_URL, REDIS_HOST, REDIS_PORT and
# REDIS_PASSWORD, ACCESS_TOKEN_SALT (salts the security tokens people sign in with) and
# JWT_SECRET_KEY. The image migrates the database when it starts. The first user to sign up
# becomes the administrator, which the first note says. /api/v1/health answers without a
# sign-in. The connection string says sslmode=disable: the database is the stack's own PostgreSQL on
# a private network without TLS, and the image's Prisma 7 driver reads the guide's sslmode=prefer
# as require and stops at its seed with "The server does not support SSL connections".
#
# Pinned to the release tag and to the digests Docker Hub serves for it.
schema: 2
name: ghostfolio
kind: compose
title: Ghostfolio
slogan: "An open source wealth management app to track stocks, ETFs and crypto."
description: "Keep your investments in one place: holdings, performance, allocation, dividends and fees across accounts, with market data from public sources. Sign-in is by a security token it shows once. The first person to sign up becomes the administrator."
category: business
tags: [finance, investing, portfolio, wealth]
logo: logo.svg
version: "3.88.0"
revision: 1
updated: 2026-10-20
homepage: https://ghostfol.io
docs: https://github.com/ghostfolio/ghostfolio#self-hosting
repository: https://github.com/ghostfolio/ghostfolio
license: AGPL-3.0-only
architectures: ["amd64", "arm", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3333
variables:
  ACCESS_TOKEN_SALT:
    generate: password32
    description: Salts the security tokens people sign in with. Changing it invalidates every token.
  JWT_SECRET_KEY:
    generate: password32
    description: Signs the sessions. Changing it signs everybody out.
  REDIS_PASSWORD:
    generate: password32
    description: The password of the stack's cache; it stays inside the stack.
  DB_PASSWORD:
    generate: password32
    description: The password of the stack's PostgreSQL account.
health:
  path: /api/v1/health
  expect: "200"
  timeout: 300
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    ghostfolio:
      image: ghostfolio/ghostfolio:3.88.0@sha256:256c524a6116d3b7879938b5d60884f1016c4dc04abf869532f71c5aade981db
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        NODE_ENV: production
        ACCESS_TOKEN_SALT: "${ACCESS_TOKEN_SALT}"
        JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
        DATABASE_URL: "postgresql://ghostfolio:${DB_PASSWORD}@db:5432/ghostfolio?connect_timeout=300&sslmode=disable"
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        REDIS_PASSWORD: "${REDIS_PASSWORD}"
      ports:
        - "127.0.0.1:${PORT}:3333"
    db:
      image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      restart: unless-stopped
      environment:
        POSTGRES_USER: ghostfolio
        POSTGRES_DB: ghostfolio
        POSTGRES_PASSWORD: "${DB_PASSWORD}"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ghostfolio -d ghostfolio"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s
      volumes:
        - ghostfolio-db:/var/lib/postgresql/data
    redis:
      image: valkey/valkey:9.0.6-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
      restart: unless-stopped
      command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}"]
      healthcheck:
        test: ["CMD-SHELL", "valkey-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
        interval: 10s
        timeout: 5s
        retries: 5
      environment:
        REDIS_PASSWORD: "${REDIS_PASSWORD}"
      volumes:
        - ghostfolio-cache:/data
  volumes:
    ghostfolio-db:
    ghostfolio-cache:
notes:
  - "Open {{ url }} now and choose \"Get Started\": the first account becomes the administrator, and until you do anybody who reaches the page can create it. The page shows your security token once: keep it, it is how you sign in."
  - "Your portfolio is in the database, the Docker volume ghostfolio-db of this application (PostgreSQL, dumped by Noust before every update): back it up before updating."
