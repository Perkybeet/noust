# Gotenberg: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/gotenberg.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: gotenberg
kind: compose
title: "Gotenberg"
slogan: "Gotenberg is a Docker-powered stateless API for PDF files."
description: "Gotenberg is a Docker-powered stateless API for PDF files."
category: backend
tags: [api, backend, pdf, tool, tools]
logo: logo.svg
version: "8.39.0"
revision: 1
updated: 2026-10-28
homepage: https://gotenberg.dev
docs: https://gotenberg.dev/docs/getting-started/introduction
repository: https://github.com/gotenberg/gotenberg
license: MIT
architectures: ["386", "amd64", "arm", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_GOTENBERG:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_USER_GOTENBERG:
    generate: "user"
    description: "The user name Noust generated for gotenberg."
  SERVICE_PASSWORD_GOTENBERG:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for gotenberg."
health: {path: /health, expect: "200-399", timeout: 180}
compose: |
  services:
    gotenberg:
      image: gotenberg/gotenberg:8.39.0@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
      environment:
        SERVICE_URL_GOTENBERG: ${SERVICE_URL_GOTENBERG}
        GOTENBERG_API_BASIC_AUTH_USERNAME: ${SERVICE_USER_GOTENBERG}
        GOTENBERG_API_BASIC_AUTH_PASSWORD: ${SERVICE_PASSWORD_GOTENBERG}
      command:
        - gotenberg
        - --api-enable-basic-auth
        - --api-disable-health-check-logging
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:3000/health
        interval: 5s
        timeout: 20s
        retries: 10
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:3000
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_USER_GOTENBERG and SERVICE_PASSWORD_GOTENBERG in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
