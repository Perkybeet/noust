# Grafana OSS from the grafana/grafana image (13.x publishes it under that name;
# grafana/grafana-oss stops at 13.0.x). From the image's own configuration:
# user 472, port 3000, data under /var/lib/grafana (GF_PATHS_DATA), SQLite by
# default. The settings are Grafana's documented GF_<SECTION>_<KEY> variables:
# GF_SERVER_ROOT_URL (so links and redirects use the public address),
# GF_SECURITY_ADMIN_USER and GF_SECURITY_ADMIN_PASSWORD (only read when the
# database is created), and GF_ANALYTICS_REPORTING_ENABLED. /api/health is its
# unauthenticated health endpoint.
schema: 2
name: grafana
kind: compose
title: Grafana
slogan: Dashboards and alerts for metrics, logs and traces.
description: The open-source observability platform, to query, visualise and alert on data from Prometheus, Loki, PostgreSQL and many more. Its own data is a SQLite file.
category: monitoring
tags: [dashboards, metrics, observability, alerts]
logo: logo.svg
version: "13.2.3"
revision: 1
updated: 2026-10-06
homepage: https://grafana.com/oss/grafana/
docs: https://grafana.com/docs/grafana/latest/
repository: https://github.com/grafana/grafana
license: AGPL-3.0-only
architectures: ["amd64", "arm", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  GF_SERVER_ROOT_URL:
    from: url
    description: The address people use; Grafana builds its links and redirects from it.
  GF_SECURITY_ADMIN_USER:
    default: admin
    description: The administrator's user name.
  GF_SECURITY_ADMIN_PASSWORD:
    generate: password32
    description: The administrator's first password. Grafana reads it only when it creates its database.
health:
  path: /api/health
  expect: "200"
compose: |
  services:
    grafana:
      image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
      restart: unless-stopped
      environment:
        GF_SERVER_ROOT_URL: "${GF_SERVER_ROOT_URL}"
        GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER}"
        GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD}"
        GF_ANALYTICS_REPORTING_ENABLED: "false"
      volumes:
        - grafana-data:/var/lib/grafana
      ports:
        - "127.0.0.1:${PORT}:3000"
  volumes:
    grafana-data:
notes:
  - "Sign in at {{ url }} as {{ vars.GF_SECURITY_ADMIN_USER }}; the password is GF_SECURITY_ADMIN_PASSWORD (noust env show {{ domain }} --unmask). Change it after signing in: Grafana reads it only on the first start."
  - "Dashboards, users and data sources are in the Docker volume grafana-data of this application: back it up before updating."
