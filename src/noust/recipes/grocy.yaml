# Grocy: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/grocy.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: grocy
kind: compose
title: "Grocy"
slogan: "Grocy is a web-based household management and grocery list application."
description: "A self-hosted groceries & household management solution for your home."
category: business
tags: [groceries, household, management, grocery, shopping, business]
logo: simple-icons:grocy
version: "4.6.0"
revision: 1
updated: 2026-10-28
homepage: https://grocy.info
docs: https://github.com/grocy/grocy
repository: https://github.com/grocy/grocy
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_GROCY:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    grocy:
      image: lscr.io/linuxserver/grocy:4.6.0@sha256:e05cef69d982b8a478abfb5761694ea9fa948449794a5d42a3b830564a513001
      environment:
        SERVICE_URL_GROCY: ${SERVICE_URL_GROCY}
        PUID: '1000'
        PGID: '1000'
        TZ: Europe/Madrid
      volumes:
        - grocy-config:/config
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80
        interval: 2s
        timeout: 10s
        retries: 15
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:80
  volumes:
    grocy-config:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume grocy-config of this application: back it up before updating."
