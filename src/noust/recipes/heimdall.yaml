# Heimdall: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/heimdall.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: heimdall
kind: compose
title: "Heimdall"
slogan: "Heimdall is a dashboard for managing and organizing your server applications."
description: "An elegant solution to organize all your web applications."
category: data
tags: [dashboard, server, applications, interface, data]
logo: logo.svg
version: "2.8.3"
revision: 1
updated: 2026-10-28
homepage: https://github.com/linuxserver/Heimdall
docs: https://github.com/linuxserver/Heimdall
repository: https://github.com/linuxserver/Heimdall
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_HEIMDALL:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    heimdall:
      image: lscr.io/linuxserver/heimdall:2.8.3@sha256:928b80d532929a3ff4f53bd49437c721e76334a6d4c9d3d992e522b9ccdd08c2
      environment:
        SERVICE_URL_HEIMDALL: ${SERVICE_URL_HEIMDALL}
        PUID: '1000'
        PGID: '1000'
        TZ: Europe/Madrid
      volumes:
        - heimdall-config:/config
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:80
        interval: 2s
        timeout: 10s
        retries: 15
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:80
  volumes:
    heimdall-config:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume heimdall-config of this application: back it up before updating."
