unavailable_reason: "Its only web interface, the dashboard, has no sign-in of its own and stores the API keys the agent works with: its compose file binds it to 127.0.0.1 and says 'it stores API keys; exposing it on LAN without auth is unsafe' and to reach it from elsewhere 'use an SSH tunnel or put it behind a reverse proxy that adds authentication' (docker-compose.yml, read 2026-10-28), and the compose file runs it on the host's network. A public site Noust writes would hand those keys to anyone. Its SECURITY.md (read 2026-10-06) also calls it 'a single-tenant personal agent'. Not available in this release."
