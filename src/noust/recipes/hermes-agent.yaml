unavailable_reason: "Its own security policy (SECURITY.md, read 2026-10-06) calls it 'a single-tenant personal agent' whose trust envelope is whatever the operator's account can reach, runs commands directly on the host by default, and states that 'the only security boundary against an adversarial LLM is the operating system'. Whether to give such a program a place on a server that holds other applications is the owner's decision, not a recipe's. Not available in this release."
