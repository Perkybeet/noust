# Honcho: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/honcho.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: honcho
kind: compose
title: "Honcho"
slogan: "A developer tool to build personalised AI applications with production-ready memory."
description: "Memory library for building stateful agents"
category: ai
tags: [ai, memory, llm, agents, rag, postgres, pgvector, redis]
logo: logo.svg
version: "3.0.12"
revision: 1
updated: 2026-10-31
homepage: https://honcho.dev/docs
docs: https://honcho.dev/docs/v3/contributing/self-hosting
repository: https://github.com/plastic-labs/honcho
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_API:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_USER_POSTGRES:
    generate: "user"
    description: "The user name Noust generated for postgres."
  SERVICE_PASSWORD_POSTGRES:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for postgres."
  LLM_OPENAI_API_KEY:
    default: ""
    secret: true
    description: "Setting LLM_OPENAI_API_KEY of the application; the template leaves it to the operator."
health: {path: /health, expect: "200-399", timeout: 180}
compose: |
  services:
    api:
      image: ghcr.io/plastic-labs/honcho:v3.0.12@sha256:8ed9a3f50269f7f18c69848f8cc9b6ed54a24fd773fbea905cafae174174fab5
      entrypoint:
        - sh
        - docker/entrypoint.sh
      environment:
        SERVICE_URL_API: ${SERVICE_URL_API}
        DB_CONNECTION_URI: postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@database:5432/postgres
        CACHE_URL: redis://redis:6379/0?suppress=true
        CACHE_ENABLED: 'true'
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
        AUTH_USE_AUTH: 'false'
        LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY}
        VECTOR_STORE_TYPE: pgvector
      healthcheck:
        test:
          - CMD
          - /app/.venv/bin/python
          - -c
          - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      depends_on:
        database:
          condition: service_healthy
        redis:
          condition: service_healthy
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:8000
    deriver:
      image: ghcr.io/plastic-labs/honcho:v3.0.12@sha256:8ed9a3f50269f7f18c69848f8cc9b6ed54a24fd773fbea905cafae174174fab5
      entrypoint:
        - /app/.venv/bin/python
        - -m
        - src.deriver
      environment:
        DB_CONNECTION_URI: postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@database:5432/postgres
        CACHE_URL: redis://redis:6379/0?suppress=true
        CACHE_ENABLED: 'true'
        LOG_LEVEL: ${LOG_LEVEL:-INFO}
        AUTH_USE_AUTH: 'false'
        LLM_OPENAI_API_KEY: ${LLM_OPENAI_API_KEY}
        VECTOR_STORE_TYPE: pgvector
      depends_on:
        api:
          condition: service_healthy
        database:
          condition: service_healthy
        redis:
          condition: service_healthy
      restart: unless-stopped
    database:
      image: pgvector/pgvector:pg15@sha256:47af0b65960b14f1c6945aa4ccae37836c632e9a6fe0eea9160936e616e5b2e9
      environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: ${SERVICE_USER_POSTGRES}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      volumes:
        - honcho_pgdata:/var/lib/postgresql/data/
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped
    redis:
      image: redis:8.2@sha256:99ffb973380cc2f47bca06bd094f7f8c7138a0879a63cb8939896a22b7a65bba
      volumes:
        - honcho_redis_data:/data
      healthcheck:
        test:
          - CMD-SHELL
          - redis-cli ping
        interval: 5s
        timeout: 5s
        retries: 5
      restart: unless-stopped
  volumes:
    honcho_pgdata:
    honcho_redis_data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_USER_POSTGRES and SERVICE_PASSWORD_POSTGRES in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volumes honcho_pgdata, honcho_redis_data of this application: back them up before updating."
