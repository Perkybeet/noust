# Jellyseerr: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/jellyseerr
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: jellyseerr
kind: compose
title: "Jellyseerr"
slogan: "Open-source media request and discovery manager for Jellyfin, Plex, and Emby."
description: "Jellyseerr is a media request manager for Jellyfin, Emby, and Plex. Self-host it on your own server with Dokploy, which deploys Jellyseerr as a Docker Compose service in a few clicks."
category: media
tags: [media, requests, jellyfin]
logo: logo.svg
version: "2.7.3"
revision: 1
updated: 2026-10-28
homepage: https://docs.seerr.dev
docs: https://docs.jellyseerr.dev/
repository: https://github.com/seerr-team/seerr
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    jellyseerr:
      image: fallenbagel/jellyseerr:2.7.3@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
      restart: unless-stopped
      volumes:
        - jellyseerr_config:/app/config
      environment:
        LOG_LEVEL: info
      ports:
        - 127.0.0.1:${PORT}:5055
  volumes:
    jellyseerr_config:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume jellyseerr_config of this application: back it up before updating."
