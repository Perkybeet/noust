# Jellystat from the image the project publishes (cyfershepard/jellystat), with the variables and folder its documentation names (github.com/CyferShepard/Jellystat, README: Docker).
schema: 2
name: jellystat
kind: compose
title: "Jellystat"
slogan: "A free and open source statistics app for Jellyfin."
description: "Keeps the history of what your Jellyfin server plays: who watched what, when and for how long, with graphs by user, library and device, and a backup of the data. It runs with its own PostgreSQL; the first visit makes its administrator."
category: media
tags: [jellyfin, statistics, media, history]
logo: logo.png
version: "1.1.12"
revision: 1
updated: 2026-10-30
homepage: https://github.com/CyferShepard/Jellystat
docs: https://github.com/CyferShepard/Jellystat
repository: https://github.com/CyferShepard/Jellystat
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  DB_PASSWORD:
    generate: "password32"
    description: "The password of the stack's PostgreSQL account."
  JWT_SECRET:
    generate: "password64"
    description: "Signs the sessions of the page."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    jellystat:
      image: cyfershepard/jellystat:1.1.12@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      environment:
        POSTGRES_USER: jellystat
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_IP: db
        POSTGRES_PORT: '5432'
        POSTGRES_DB: jfstat
        JWT_SECRET: ${JWT_SECRET}
        TZ: UTC
      volumes:
        - jellystat-backup:/app/backend/backup-data
      ports:
        - 127.0.0.1:${PORT}:3000
    db:
      image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
      restart: unless-stopped
      environment:
        POSTGRES_USER: jellystat
        POSTGRES_DB: jfstat
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U jellystat -d jfstat
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s
      volumes:
        - jellystat-db:/var/lib/postgresql/data
  volumes:
    jellystat-backup:
    jellystat-db:
notes:
  - "Open {{ url }}. The first visit asks to create the administrator, then the address and key of your Jellyfin: do it right after installing."
  - "Its data is in the Docker volumes jellystat-backup, jellystat-db of this application, the databases dumped by Noust before every update: back them up before updating."
