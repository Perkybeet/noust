# Kestra: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/kestra
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: kestra
kind: compose
title: "Kestra"
slogan: "Orchestrate everything, everywhere."
description: "Unified Orchestration Platform to Simplify Business-Critical Workflows and Govern them as Code and from the UI."
category: ai
tags: [automation, ai]
logo: logo.svg
version: "2.0.8"
revision: 1
updated: 2026-10-30
homepage: https://go.kestra.io/home
docs: https://kestra.io/docs
repository: https://github.com/kestra-io/kestra
license: Apache-2.0
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  POSTGRES_PASSWORD:
    generate: "password32"
    secret: true
    description: "The password of the stack's PostgreSQL account."
  APP_DOMAIN:
    from: "fqdn"
    description: "The domain people use to reach the application."
  APP_URL:
    from: "url"
    description: "The address people use to reach the application."
  ADMIN_EMAIL:
    value: "admin@${APP_DOMAIN}"
    description: "The address people sign in with (Kestra asks for a valid email address)."
  ADMIN_PASSWORD_BASE:
    generate: "password32"
    secret: true
    description: "The random part of the administrator's password."
  ADMIN_PASSWORD:
    value: "${ADMIN_PASSWORD_BASE}Aa1"
    secret: true
    description: "The administrator's password; Kestra asks for an upper-case letter, a lower-case one and a number."
health: {path: /, expect: "200-399,401", timeout: 180}
root_equivalent: docker_socket
compose: |
  services:
    postgres:
      image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
      volumes:
        - postgres-data:/var/lib/postgresql
      environment:
        POSTGRES_DB: kestra
        POSTGRES_USER: kestra
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
        interval: 30s
        timeout: 10s
        retries: 10
      restart: unless-stopped
    kestra:
      image: kestra/kestra:v2.0.8@sha256:ad7602269219ab969e8194a6000e139ad5d5e153556435afb8d2a35a19993ccd
      user: root
      command: server standalone
      volumes:
        - kestra-data:/app/storage
        - /var/run/docker.sock:/var/run/docker.sock
        - kestra-kestra-wd:/tmp/kestra-wd
      environment:
        KESTRA_CONFIGURATION: |
          datasources:
            postgres:
              url: jdbc:postgresql://postgres:5432/kestra
              driverClassName: org.postgresql.Driver
              username: kestra
              password: ${POSTGRES_PASSWORD}
          kestra:
            server:
              basicAuth:
                enabled: true
                username: "${ADMIN_EMAIL}"
                password: "${ADMIN_PASSWORD}"
            repository:
              type: postgres
            storage:
              type: local
              local:
                basePath: "/app/storage"
            queue:
              type: postgres
            tasks:
              tmpDir:
                path: /tmp/kestra-wd/tmp
            url: ${APP_URL}/
      depends_on:
        postgres:
          condition: service_healthy
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:8080
  volumes:
    postgres-data:
    kestra-data:
    kestra-kestra-wd:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "Kestra controls the Docker daemon of this server, which is the same as root on it: it can start any container with any part of the server mounted, Noust's applications included. Give its sign-in only to people you would give root."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volumes postgres-data, kestra-data, kestra-kestra-wd of this application: back them up before updating."
