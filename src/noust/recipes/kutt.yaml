# Kutt: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/kutt
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: kutt
kind: compose
title: "Kutt"
slogan: "Free Modern URL Shortener."
description: "Kutt is a modern URL shortener with support for custom domains. Create and edit links, view statistics, manage users, and more."
category: utilities
tags: [link-shortener, link-sharing, utilities]
logo: logo.png
version: "3.2.6"
revision: 1
updated: 2026-10-31
homepage: https://kutt.to
docs: https://github.com/thedevs-network/kutt#kuttit
repository: https://github.com/thedevs-network/kutt
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  JWT_SECRET:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for jwt secret."
  DEFAULT_DOMAIN:
    from: "fqdn"
    description: "The address people use to reach the application, as the template builds it."
  TRUST_PROXY:
    default: "false"
    description: "Setting TRUST_PROXY of the application; the template leaves it to the operator."
  DISALLOW_ANONYMOUS_LINKS:
    default: "true"
    description: "Setting DISALLOW_ANONYMOUS_LINKS of the application; the template leaves it to the operator."
  CUSTOM_DOMAIN_USE_HTTPS:
    default: "true"
    description: "Setting CUSTOM_DOMAIN_USE_HTTPS of the application; the template leaves it to the operator."
  MAIL_ENABLED:
    default: "false"
    description: "Setting MAIL_ENABLED of the application; the template leaves it to the operator."
  MAIL_HOST:
    default: "''"
    description: "Setting MAIL_HOST of the application; the template leaves it to the operator."
  MAIL_PORT:
    default: "'22'"
    description: "Setting MAIL_PORT of the application; the template leaves it to the operator."
  MAIL_SECURE:
    default: "true"
    description: "Setting MAIL_SECURE of the application; the template leaves it to the operator."
  MAIL_USER:
    default: "''"
    description: "Setting MAIL_USER of the application; the template leaves it to the operator."
  MAIL_FROM:
    default: "''"
    description: "Setting MAIL_FROM of the application; the template leaves it to the operator."
  MAIL_PASSWORD:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for mail password."
  CONTACT_EMAIL:
    default: "''"
    description: "Setting CONTACT_EMAIL of the application; the template leaves it to the operator."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    kutt:
      image: kutt/kutt:v3.2.6@sha256:fa3d24a89b04e0feb542ed7d3c77993d58dbcc1406e5291a369595d543886146
      volumes:
        - kutt_db_data:/var/lib/kutt
        - kutt-custom:/kutt/custom
      environment:
        DB_FILENAME: /var/lib/kutt/data.sqlite
        JWT_SECRET: ${JWT_SECRET}
        DEFAULT_DOMAIN: ${DEFAULT_DOMAIN}
        TRUST_PROXY: ${TRUST_PROXY}
        DISALLOW_ANONYMOUS_LINKS: ${DISALLOW_ANONYMOUS_LINKS}
        CUSTOM_DOMAIN_USE_HTTPS: ${CUSTOM_DOMAIN_USE_HTTPS}
        MAIL_ENABLED: ${MAIL_ENABLED}
        MAIL_HOST: ${MAIL_HOST}
        MAIL_PORT: ${MAIL_PORT}
        MAIL_SECURE: ${MAIL_SECURE}
        MAIL_USER: ${MAIL_USER}
        MAIL_FROM: ${MAIL_FROM}
        MAIL_PASSWORD: ${MAIL_PASSWORD}
        CONTACT_EMAIL: ${CONTACT_EMAIL}
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:3000
  volumes:
    kutt_db_data:
    kutt-custom:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volumes kutt_db_data, kutt-custom of this application: back them up before updating."
