# LanguageTool: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/languagetool
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: languagetool
kind: compose
title: "LanguageTool"
slogan: "Style and Grammar Checker for 25+ Languages"
description: "LanguageTool is an open-source grammar, spelling, and style checker. Self-host it on your own server with Dokploy, which deploys LanguageTool as a Docker Compose service in a few clicks."
category: development
tags: [writing, grammar, spellcheck, api, development]
logo: simple-icons:languagetool
version: "6.6"
revision: 1
updated: 2026-10-28
homepage: https://languagetool.org
docs: https://dev.languagetool.org/http-server
repository: https://github.com/languagetool-org/languagetool
license: LGPL-2.1-only
architectures: ["amd64", "arm", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
health: {path: /v2/languages, expect: "200-399", timeout: 180}
compose: |
  services:
    languagetool:
      image: collabora/languagetool:6.6@sha256:a93a2470a49c28e36b0e3b73f4562dab21a532ad10819ddc50bf69f80e98240d
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:8010
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
