# Mage AI: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/mage-ai.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: mage-ai
kind: compose
title: "Mage AI"
slogan: "Build, run, and manage data pipelines for integrating and transforming data."
description: "Build, run, and manage data pipelines for integrating and transforming data."
category: automation
tags: [data, dbt, etl, pipelines, automation]
logo: logo.svg
version: "0.9.78"
revision: 1
updated: 2026-10-28
homepage: https://www.mage.ai
docs: https://docs.mage.ai
repository: https://github.com/mage-ai/mage-ai
license: Apache-2.0
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_MAGEAI:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    mage-ai:
      image: mageai/mageai:0.9.78@sha256:f44051b2af657cbf971eafac501643ae179e010bf880f1706f3dec8b591ac757
      command: mage start default_project
      environment:
        SERVICE_URL_MAGEAI: ${SERVICE_URL_MAGEAI}
        PROJECT_NAME: default_project
        USER_CODE_PATH: /home/src/default_project
        ENV: production
      volumes:
        - mageai_data:/home/src/
      restart: unless-stopped
      healthcheck:
        test:
          - CMD
          - curl
          - -s
          - -f
          - -o
          - /dev/null
          - http://127.0.0.1:6789
        interval: 30s
        timeout: 10s
        retries: 5
      ports:
        - 127.0.0.1:${PORT}:6789
  volumes:
    mageai_data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume mageai_data of this application: back it up before updating."
