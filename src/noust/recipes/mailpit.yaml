# Mailpit from its own image: a mail server that keeps what it receives for a
# developer to read. From the image's configuration
# (ghcr.io/axllent/mailpit:v1.31.4): web interface and API on 8025, SMTP on
# 1025, the settings are MP_* variables (cmd/root.go), and /livez and /readyz
# answer without the interface's login. The web interface is protected with
# MP_UI_AUTH (user:password), because what it shows is every message sent to it.
# SMTP is published on 127.0.0.1 only, so only applications of this server can
# send to it; it accepts any login because nothing outside the server reaches it.
schema: 2
name: mailpit
kind: compose
title: Mailpit
slogan: Catch every e-mail an application sends, and read it in a web interface.
description: "An e-mail and SMTP testing tool: applications send mail to it instead of to the world, and you read it in the browser or through its API. The web interface asks for a password."
category: development
tags: [email, smtp, testing, development]
logo: logo.svg
version: "1.31.4"
revision: 1
updated: 2026-10-06
homepage: https://mailpit.axllent.org
docs: https://mailpit.axllent.org/docs/
repository: https://github.com/axllent/mailpit
license: MIT
architectures: ["386", "amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 8025
variables:
  MAILPIT_USER:
    default: admin
    description: The user name of the web interface.
  MAILPIT_PASSWORD:
    generate: password32
    description: The password of the web interface.
  MAILPIT_SMTP_PORT:
    default: "1025"
    description: The port on 127.0.0.1 applications of this server send mail to.
health:
  path: /livez
  expect: "200"
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    mailpit:
      image: ghcr.io/axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
      restart: unless-stopped
      environment:
        MP_DATABASE: /data/mailpit.db
        MP_MAX_MESSAGES: "5000"
        MP_UI_AUTH: "${MAILPIT_USER}:${MAILPIT_PASSWORD}"
        MP_SMTP_AUTH_ACCEPT_ANY: "1"
        MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      volumes:
        - mailpit-data:/data
      ports:
        - "127.0.0.1:${PORT}:8025"
        - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
  volumes:
    mailpit-data:
notes:
  - "Open {{ url }} and sign in as {{ vars.MAILPIT_USER }}; the password is MAILPIT_PASSWORD (noust env show {{ domain }} --unmask)."
  - "Point your applications' SMTP at 127.0.0.1 port {{ vars.MAILPIT_SMTP_PORT }}, with no TLS and any login. It is not reachable from outside this server."
