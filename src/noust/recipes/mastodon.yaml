# Mastodon from the image the project publishes (ghcr.io/mastodon/mastodon), with the settings its documentation names (docs.joinmastodon.org/admin/config and the project's docker-compose.yml and .env.production.sample at v4.7.4).
schema: 2
name: mastodon
kind: compose
title: "Mastodon"
slogan: "Your self-hosted, globally interconnected microblogging community."
description: "A federated social network: microblogging, follows, boosts, lists, media and moderation tools, interoperating with the whole fediverse. Runs the web app, the streaming server and the job worker beside its own PostgreSQL and Redis-compatible store. Registration is open until you close it."
category: communication
tags: [fediverse, activitypub, microblogging, social]
logo: simple-icons:mastodon
version: "4.7.4"
revision: 1
updated: 2026-10-30
homepage: https://joinmastodon.org
docs: https://joinmastodon.org
repository: https://github.com/mastodon/mastodon
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  DB_PASSWORD:
    generate: "password32"
    description: "The password of the stack's PostgreSQL account."
  LOCAL_DOMAIN:
    from: "fqdn"
    description: "The name of this server, the part of every account address after the @. It cannot change after the first start."
  STREAMING_DOMAIN:
    required: true
    description: "A second name that points at this server, where the browser opens its live connection."
  STREAMING_PORT:
    default: "4000"
    description: "The streaming server's port on 127.0.0.1."
  SECRET_KEY_BASE:
    generate: "hex64"
    description: "Signs sessions; changing it signs everybody out."
  AR_DETERMINISTIC_KEY:
    generate: "password32"
    description: "Encrypts fields Mastodon looks up by value. Never change it once in use: data would be lost."
  AR_KEY_DERIVATION_SALT:
    generate: "password32"
    description: "Salt of the database encryption keys. Never change it once in use."
  AR_PRIMARY_KEY:
    generate: "password32"
    description: "Encrypts sensitive fields. Never change it once in use."
health: {path: /health, expect: "200", timeout: 300}
entrypoints:
  streaming:
    title: "Streaming"
    description: "Where the browser opens the live connection of the timelines."
    domain_variable: "STREAMING_DOMAIN"
    port_variable: "STREAMING_PORT"
files:
  noust.nginx.yaml: noust.nginx.yaml
compose: |
  services:
    web:
      image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
      restart: unless-stopped
      command:
        - sh
        - -c
        - bundle exec rails db:prepare && exec bundle exec puma -C config/puma.rb
      healthcheck:
        test:
          - CMD-SHELL
          - curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1
        interval: 15s
        timeout: 10s
        retries: 20
        start_period: 60s
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        RAILS_ENV: production
        NODE_ENV: production
        LOCAL_DOMAIN: ${LOCAL_DOMAIN}
        REDIS_HOST: redis
        REDIS_PORT: '6379'
        DB_HOST: db
        DB_PORT: '5432'
        DB_USER: mastodon
        DB_NAME: mastodon
        DB_PASS: ${DB_PASSWORD}
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${AR_DETERMINISTIC_KEY}
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_KEY_DERIVATION_SALT}
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${AR_PRIMARY_KEY}
        STREAMING_API_BASE_URL: wss://${STREAMING_DOMAIN}
        SMTP_SERVER:
        SMTP_PORT:
        SMTP_LOGIN:
        SMTP_PASSWORD:
        SMTP_FROM_ADDRESS:
      volumes:
        - mastodon-system:/mastodon/public/system
      ports:
        - 127.0.0.1:${PORT}:3000
    streaming:
      image: ghcr.io/mastodon/mastodon-streaming:v4.7.4@sha256:b896be8bc93db513695c3ebac8442c09453065ab1be06dfc49fe3c16a91c825c
      command:
        - node
        - ./streaming/index.js
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        web:
          condition: service_healthy
      environment:
        RAILS_ENV: production
        NODE_ENV: production
        LOCAL_DOMAIN: ${LOCAL_DOMAIN}
        REDIS_HOST: redis
        REDIS_PORT: '6379'
        DB_HOST: db
        DB_PORT: '5432'
        DB_USER: mastodon
        DB_NAME: mastodon
        DB_PASS: ${DB_PASSWORD}
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${AR_DETERMINISTIC_KEY}
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_KEY_DERIVATION_SALT}
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${AR_PRIMARY_KEY}
        STREAMING_API_BASE_URL: wss://${STREAMING_DOMAIN}
        SMTP_SERVER:
        SMTP_PORT:
        SMTP_LOGIN:
        SMTP_PASSWORD:
        SMTP_FROM_ADDRESS:
        PORT: '4000'
        BIND: 0.0.0.0
      ports:
        - 127.0.0.1:${STREAMING_PORT}:4000
      restart: unless-stopped
    sidekiq:
      image: ghcr.io/mastodon/mastodon:v4.7.4@sha256:8cbc9c9ffa595c4ced3854b63b8f173251be710f9bbf2d369926023c19666311
      command:
        - bundle
        - exec
        - sidekiq
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        web:
          condition: service_healthy
      environment:
        RAILS_ENV: production
        NODE_ENV: production
        LOCAL_DOMAIN: ${LOCAL_DOMAIN}
        REDIS_HOST: redis
        REDIS_PORT: '6379'
        DB_HOST: db
        DB_PORT: '5432'
        DB_USER: mastodon
        DB_NAME: mastodon
        DB_PASS: ${DB_PASSWORD}
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${AR_DETERMINISTIC_KEY}
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${AR_KEY_DERIVATION_SALT}
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${AR_PRIMARY_KEY}
        STREAMING_API_BASE_URL: wss://${STREAMING_DOMAIN}
        SMTP_SERVER:
        SMTP_PORT:
        SMTP_LOGIN:
        SMTP_PASSWORD:
        SMTP_FROM_ADDRESS:
      volumes:
        - mastodon-system:/mastodon/public/system
      restart: unless-stopped
    db:
      image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
      restart: unless-stopped
      environment:
        POSTGRES_USER: mastodon
        POSTGRES_DB: mastodon
        POSTGRES_PASSWORD: ${DB_PASSWORD}
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U mastodon -d mastodon
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s
      volumes:
        - mastodon-db:/var/lib/postgresql/data
    redis:
      image: valkey/valkey:9.0.6-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
      restart: unless-stopped
      command:
        - valkey-server
        - --appendonly
        - 'yes'
      healthcheck:
        test:
          - CMD
          - valkey-cli
          - ping
        interval: 10s
        timeout: 5s
        retries: 10
      volumes:
        - mastodon-redis:/data
  volumes:
    mastodon-system:
    mastodon-db:
    mastodon-redis:
notes:
  - "Open {{ url }}. Make the first account (sign up on the page, or `noust app exec {{ domain }} -- bin/tootctl accounts create NAME --email EMAIL --confirmed --role Owner`) and close registration if the server is not for the public."
  - "LOCAL_DOMAIN is part of every account's address and cannot change after the first start. The three ACTIVE_RECORD_ENCRYPTION values must never change once Mastodon holds data: keep a copy of them with the backups (noust env show {{ domain }} --unmask)."
  - "The second name (STREAMING_DOMAIN) must point at this server before the live timelines work; Noust adds it to the site and orders its certificate. E-mail (confirmations, notifications) needs an SMTP server: set SMTP_SERVER, SMTP_PORT, SMTP_LOGIN, SMTP_PASSWORD and SMTP_FROM_ADDRESS in the application's environment and restart it. Web Push (VAPID keys) is not set up."
  - "Its data is in the Docker volumes mastodon-system, mastodon-db, mastodon-redis of this application, the databases dumped by Noust before every update: back them up before updating."
