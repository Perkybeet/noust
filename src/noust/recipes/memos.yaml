# Memos from its own image. The configuration is what the project's release
# smoke test runs the image with (scripts/release_smoke_test.sh at v0.31.0):
# MEMOS_MODE=prod, MEMOS_INSTANCE_URL, and everything under /var/opt/memos in a
# volume. The image exposes 5230 (MEMOS_PORT=5230 in its environment), runs its
# entrypoint as root and keeps SQLite in that volume. Its health endpoint is
# /healthz (server/server.go).
#
# Pinned to the release tag and the digest ghcr.io serves for it, which is also
# the digest Docker Hub serves for neosmemo/memos:0.31.0.
schema: 2
name: memos
kind: compose
title: Memos
slogan: A privacy-first, lightweight note-taking service.
description: A self-hosted note-taking service for quick thoughts, with Markdown, tags and an API. It keeps everything in one SQLite file.
category: productivity
tags: [notes, markdown, journal, sqlite]
logo: logo.svg
version: "0.31.0"
revision: 1
updated: 2026-10-06
homepage: https://www.usememos.com
docs: https://www.usememos.com/docs
repository: https://github.com/usememos/memos
license: MIT
architectures: ["amd64", "arm", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 5230
variables:
  MEMOS_INSTANCE_URL:
    from: url
    description: The address people use; Memos builds its links from it.
health:
  path: /healthz
  expect: "200"
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    memos:
      image: ghcr.io/usememos/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
      restart: unless-stopped
      environment:
        MEMOS_MODE: prod
        MEMOS_INSTANCE_URL: "${MEMOS_INSTANCE_URL}"
      volumes:
        - memos-data:/var/opt/memos
      ports:
        - "127.0.0.1:${PORT}:5230"
  volumes:
    memos-data:
notes:
  - "Open {{ url }} now and sign up: the first account becomes the host, and until it exists anyone who reaches the page can take that role."
  - "Everything Memos stores is in the Docker volume memos-data of this application: back it up before updating."
