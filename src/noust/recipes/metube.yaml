# Metube: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/metube.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: metube
kind: compose
title: "Metube"
slogan: "A web GUI for youtube-dl with playlist support."
description: "MeTube is a web-based YouTube downloader that allows downloading videos and audio using yt-dlp."
category: communication
tags: [youtube, download, videos, playlist, downloader, media, communication]
logo: logo.svg
version: "2026.10.27"
revision: 1
updated: 2026-10-31
homepage: https://github.com/alexta69/metube
docs: https://github.com/alexta69/metube
repository: https://github.com/alexta69/metube
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_METUBE:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    metube:
      image: ghcr.io/alexta69/metube:2026.10.27@sha256:845a67373a9f9e62b88e5f9067867202200d63db3615a051acbd77b09e86b9ce
      environment:
        SERVICE_URL_METUBE: ${SERVICE_URL_METUBE}
        UID: '1000'
        GID: '1000'
      volumes:
        - metube-downloads:/downloads
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:8081
        interval: 2s
        timeout: 10s
        retries: 15
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:8081
  volumes:
    metube-downloads:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume metube-downloads of this application: back it up before updating."
