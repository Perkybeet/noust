# n8n in queue mode, from the same image as the n8n recipe and the layout of the project's own
# example (github.com/n8n-io/n8n-hosting, docker-compose/withPostgresAndWorker, and
# docs.n8n.io/hosting/scaling/queue-mode/): the main instance serves the editor and the webhooks and
# puts every execution in a Redis queue (EXECUTIONS_MODE=queue, QUEUE_BULL_REDIS_HOST), and a worker
# (the image's `worker` command) takes them off it. Main and worker share the database and the same
# N8N_ENCRYPTION_KEY, which is why it is one variable here. Valkey, the BSD-licensed Redis fork, takes
# the same protocol. More workers: raise `replicas` of the worker in the stack's Compose file; the
# queue is what spreads the work.
#
# n8n is source-available: its Sustainable Use License (LICENSE.md of n8n-io/n8n, read on
# 2026-10-30) allows using and modifying it for your own internal business purposes, and
# not selling it or offering it to others as a hosted service. Noust redistributes none of it.
schema: 2
name: n8n-queue
kind: compose
title: n8n with workers
slogan: "n8n in queue mode: the editor and the webhooks apart from the workers that run the executions."
description: "Source-available (Sustainable Use License) workflow automation in queue mode: a main instance, a worker, Redis-compatible Valkey and PostgreSQL, so heavy executions do not slow the editor. For your own business, not to resell. Use the n8n recipe for a single container."
category: automation
tags: [automation, workflows, queue, workers]
logo: simple-icons:n8n
version: "2.45.7"
revision: 1
updated: 2026-10-30
homepage: https://n8n.io
docs: https://docs.n8n.io/hosting/scaling/queue-mode/
repository: https://github.com/n8n-io/n8n
license: LicenseRef-n8n-Sustainable-Use
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
  - About 2 GB of memory for the main instance, the worker, the database and the queue
port: 5678
variables:
  PUBLIC_URL:
    from: url
    description: The address people use to reach n8n.
  FQDN:
    from: fqdn
    description: The host name of that address.
  SCHEME:
    from: scheme
    description: http or https, as the address is served.
  SECURE_COOKIE:
    from: https
    description: Whether the session cookie is sent only over https.
  N8N_ENCRYPTION_KEY:
    generate: password64
    description: Encrypts every credential n8n stores, the same for the main instance and the worker; keep a copy.
  DB_PASSWORD:
    generate: password32
    description: The password of the stack's PostgreSQL account.
  GENERIC_TIMEZONE:
    default: UTC
    description: The time zone schedules run in (a name such as Europe/Madrid).
health:
  path: /healthz
  expect: "200"
  timeout: 150
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    n8n:
      image: n8nio/n8n:2.45.7@sha256:9a8d8dcea75667496695d7810d7e1fe018a65efb36cc499d347f3931b3957b5d
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        DB_TYPE: postgresdb
        DB_POSTGRESDB_HOST: db
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: n8n
        DB_POSTGRESDB_USER: n8n
        DB_POSTGRESDB_PASSWORD: "${DB_PASSWORD}"
        EXECUTIONS_MODE: queue
        QUEUE_BULL_REDIS_HOST: redis
        QUEUE_BULL_REDIS_PORT: "6379"
        QUEUE_HEALTH_CHECK_ACTIVE: "true"
        OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
        N8N_HOST: "${FQDN}"
        N8N_PORT: "5678"
        N8N_PROTOCOL: "${SCHEME}"
        N8N_EDITOR_BASE_URL: "${PUBLIC_URL}/"
        WEBHOOK_URL: "${PUBLIC_URL}/"
        N8N_PROXY_HOPS: "1"
        N8N_SECURE_COOKIE: "${SECURE_COOKIE}"
        N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
        GENERIC_TIMEZONE: "${GENERIC_TIMEZONE}"
        TZ: "${GENERIC_TIMEZONE}"
        N8N_DIAGNOSTICS_ENABLED: "false"
      volumes:
        - n8n-data:/home/node/.n8n
      ports:
        - "127.0.0.1:${PORT}:5678"
    worker:
      image: n8nio/n8n:2.45.7@sha256:9a8d8dcea75667496695d7810d7e1fe018a65efb36cc499d347f3931b3957b5d
      restart: unless-stopped
      command: ["worker"]
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        n8n:
          condition: service_started
      environment:
        DB_TYPE: postgresdb
        DB_POSTGRESDB_HOST: db
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: n8n
        DB_POSTGRESDB_USER: n8n
        DB_POSTGRESDB_PASSWORD: "${DB_PASSWORD}"
        EXECUTIONS_MODE: queue
        QUEUE_BULL_REDIS_HOST: redis
        QUEUE_BULL_REDIS_PORT: "6379"
        QUEUE_HEALTH_CHECK_ACTIVE: "true"
        N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
        GENERIC_TIMEZONE: "${GENERIC_TIMEZONE}"
        TZ: "${GENERIC_TIMEZONE}"
        N8N_DIAGNOSTICS_ENABLED: "false"
      volumes:
        - n8n-data:/home/node/.n8n
    db:
      image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      restart: unless-stopped
      environment:
        POSTGRES_USER: n8n
        POSTGRES_DB: n8n
        POSTGRES_PASSWORD: "${DB_PASSWORD}"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s
      volumes:
        - n8n-db:/var/lib/postgresql/data
    redis:
      image: valkey/valkey:9.0.6-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
      restart: unless-stopped
      command: ["valkey-server", "--appendonly", "yes"]
      healthcheck:
        test: ["CMD", "valkey-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 10
      volumes:
        - n8n-queue:/data
  volumes:
    n8n-data:
    n8n-db:
    n8n-queue:
notes:
  - "Open {{ url }} now and create the owner account: until someone does, anyone who reaches it can."
  - "The main instance and the worker share one database and one encryption key. N8N_ENCRYPTION_KEY encrypts every credential n8n stores: keep a copy (noust env show {{ domain }} --unmask); without it the credentials cannot be decrypted, even from a backup."
  - "Workflows, executions and credentials are in the PostgreSQL of this stack (Docker volume n8n-db, dumped by Noust before every update); the key file and community nodes are in n8n-data, and the queue's append-only file in n8n-queue. Back up all three before updating."
  - "n8n is source-available under its Sustainable Use License: it is for your own internal use, and may not be offered to others as a hosted service."
