# n8n is published as an npm package, not as a repository to build, so the
# source is a two-line package.json rendered from the recipe (assets/n8n/)
# that depends on a pinned n8n. The 1.x line runs on Node.js 20.19 to 24; 2.x
# needs Node.js 24 and is a recipe revision of its own once it has been
# deployed here. Its SQLite database and encryption key file live in
# N8N_USER_FOLDER, kept in shared/ across releases.
#
# The version in assets/n8n/package.json and `version` below are one number:
# a test refuses a recipe where they differ.
schema: 2
name: n8n
kind: native
title: n8n
slogan: Workflow automation with a visual editor.
description: "Source-available (Sustainable Use License) workflow automation with a visual editor and hundreds of integrations: for your own business, not to resell. It runs as a pinned npm package, with its data kept in shared/ across releases."
category: automation
tags: [automation, workflows, integrations, nodejs]
logo: logo.svg
version: "1.123.82"
revision: 1
updated: 2026-10-06
homepage: https://n8n.io
docs: https://docs.n8n.io
repository: https://github.com/n8n-io/n8n
license: LicenseRef-n8n-Sustainable-Use
needs:
  - Node.js 20.19 to 24, with npm
  - About 2 GB of disk for its dependencies
app_type: nodejs
source:
  template:
    package.json: package.json
layout: releases
port: 5678
variables:
  PUBLIC_URL: {from: url}
  APP_PATH: {from: app_path}
  N8N_PORT: {from: port}
  N8N_LISTEN_ADDRESS: {value: "127.0.0.1"}
  N8N_HOST: {from: fqdn}
  N8N_PROTOCOL: {from: scheme}
  N8N_EDITOR_BASE_URL: {value: "${PUBLIC_URL}/"}
  WEBHOOK_URL: {value: "${PUBLIC_URL}/"}
  N8N_SECURE_COOKIE: {from: https}
  N8N_USER_FOLDER: {value: "${APP_PATH}/shared/data"}
  N8N_ENCRYPTION_KEY:
    generate: password64
    description: Encrypts every credential n8n stores; keep a copy.
  N8N_DIAGNOSTICS_ENABLED: {value: "false"}
persistent_paths:
  - data
health:
  path: /healthz
  expect: "200"
notes:
  - "Open {{ url }} now to create the owner account: until then, anyone who reaches it can."
  - "N8N_ENCRYPTION_KEY encrypts every stored credential: keep a copy (noust env show {{ domain }}); without it they cannot be decrypted."
