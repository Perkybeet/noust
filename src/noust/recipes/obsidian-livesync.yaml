# Obsidian LiveSync: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/obsidian-livesync.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: obsidian-livesync
kind: compose
title: "Obsidian LiveSync"
slogan: "Self-hosted sync backend for Obsidian LiveSync plugin using CouchDB"
description: "Obsidian LiveSync with CouchDB for real-time note synchronization."
category: files
tags: [obsidian, couchdb, sync, notes, markdown, database, files]
logo: logo.svg
version: "3.4.2"
revision: 1
updated: 2026-10-31
homepage: https://github.com/vrtmrz/obsidian-livesync
docs: https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md
repository: https://github.com/vrtmrz/obsidian-livesync
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_FQDN_COUCHDB:
    from: "fqdn"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_USER_COUCHDB:
    generate: "user"
    description: "The user name Noust generated for couchdb."
  SERVICE_PASSWORD_64_COUCHDB:
    generate: "password64"
    secret: true
    description: "The secret Noust generated for couchdb."
  MAX_DOCUMENT_SIZE:
    default: "52428800"
    description: "Setting MAX_DOCUMENT_SIZE of the application; the template leaves it to the operator."
  MAX_HTTP_REQUEST_SIZE:
    default: "67108864"
    description: "Setting MAX_HTTP_REQUEST_SIZE of the application; the template leaves it to the operator."
health: {path: /, expect: "200-399,401", timeout: 180}
files:
  files/couchdb/local.ini:
    asset: files/couchdb/local.ini
    render: true
    mode: "0644"
compose: |
  services:
    couchdb:
      image: couchdb:3.4.2@sha256:2817ad50b5c5cf7461f5963670466197426605a790a19a6208068c509a2d8a59
      environment:
        SERVICE_FQDN_COUCHDB: ${SERVICE_FQDN_COUCHDB}
        COUCHDB_USER: ${SERVICE_USER_COUCHDB}
        COUCHDB_PASSWORD: ${SERVICE_PASSWORD_64_COUCHDB}
        MAX_DOCUMENT_SIZE: ${MAX_DOCUMENT_SIZE:-52428800}
        MAX_HTTP_REQUEST_SIZE: ${MAX_HTTP_REQUEST_SIZE:-67108864}
      volumes:
        - ./files/couchdb/local.ini:/opt/couchdb/etc/local.ini
        - couchdb-data:/opt/couchdb/data
      healthcheck:
        test:
          - CMD-SHELL
          - curl -f -u "$${COUCHDB_USER}:$${COUCHDB_PASSWORD}" http://localhost:5984/_up
        interval: 30s
        timeout: 10s
        start_period: 40s
        retries: 3
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:5984
  volumes:
    couchdb-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_USER_COUCHDB and SERVICE_PASSWORD_64_COUCHDB in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume couchdb-data of this application: back it up before updating."
