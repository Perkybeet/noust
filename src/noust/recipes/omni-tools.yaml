# Omni-Tools: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/omni-tools
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: omni-tools
kind: compose
title: "Omni-Tools"
slogan: "Self-hosted collection of powerful web-based tools for everyday tasks."
description: "Omni-Tools is a collection of useful tools in a single self-hosted web application."
category: analytics
tags: [tools, utilities, collection, self-hosted, analytics]
logo: logo.svg
version: "0.7.0"
revision: 1
updated: 2026-10-28
homepage: https://omnitools.app
docs: https://github.com/iib0011/omni-tools
repository: https://github.com/iib0011/omni-tools
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    omni-tools:
      image: iib0011/omni-tools:0.7.0@sha256:85f0e052a97326396c753e39de0ef74631c0783999ccca81ebc36262903ec9fa
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:80
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
