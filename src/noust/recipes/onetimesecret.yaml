# Onetime Secret: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/onetimesecret.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: onetimesecret
kind: compose
title: "Onetime Secret"
slogan: "Share sensitive information securely with self-destructing links that are only viewable once."
description: "Share sensitive information securely with self-destructing links that are only viewable once."
category: security
tags: [auth, password, secret, secure, security]
logo: logo.svg
version: "0.26.19"
revision: 1
updated: 2026-10-30
homepage: https://onetimesecret.com
docs: https://docs.onetimesecret.com
repository: https://github.com/onetimesecret/onetimesecret
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_ONETIMESECRET:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_PASSWORD_REDIS:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for redis."
  SERVICE_PASSWORD_ONETIMESECRET:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for onetimesecret."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    onetimesecret:
      image: onetimesecret/onetimesecret:v0.26.19@sha256:eb630051046042195a1dee73367f4f02a33ab3275bdc4d77a5d2c3dba88d3f0e
      environment:
        SERVICE_URL_ONETIMESECRET: ${SERVICE_URL_ONETIMESECRET}
        AUTH_AUTOVERIFY: ${AUTH_AUTOVERIFY:-true}
        AUTH_SIGNUP: ${AUTH_SIGNUP:-true}
        COLONEL: ${COLONEL:-admin@example.com}
        HOST: ${HOST:-localhost}
        REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
        SECRET: ${SERVICE_PASSWORD_ONETIMESECRET}
        SSL: ${SSL:-false}
        RACK_ENV: production
      depends_on:
        redis:
          condition: service_healthy
      healthcheck:
        test:
          - CMD
          - ruby
          - -rnet/http
          - -e
          - 'exit(Net::HTTP.get_response(URI(''http://localhost:3000'')).is_a?(Net::HTTPSuccess) ? 0 : 1)'
        interval: 30s
        timeout: 10s
        retries: 3
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:3000
    redis:
      image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
      command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
      healthcheck:
        test:
          - CMD
          - redis-cli
          - ping
        interval: 30s
        timeout: 10s
        retries: 3
      restart: unless-stopped
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_PASSWORD_REDIS and SERVICE_PASSWORD_ONETIMESECRET in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
