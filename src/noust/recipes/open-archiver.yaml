# Open Archiver: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/open-archiver.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: open-archiver
kind: compose
title: "Open Archiver"
slogan: "A self-hosted, open-source email archiving solution with full-text search capability."
description: "Self-hosted, open-source email archiving solution with full-text search."
category: search
tags: [email, archiving, compliance, search]
logo: logo.png
version: "0.6.2"
revision: 1
updated: 2026-10-30
homepage: https://openarchiver.com
docs: https://docs.openarchiver.com/
repository: https://github.com/LogicLabs-OU/OpenArchiver
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_OPENARCHIVER:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_HEX_64_ENCRYPTIONKEY:
    generate: "hex64"
    secret: true
    description: "The secret Noust generated for service hex 64 encryptionkey."
  SERVICE_HEX_64_STORAGEENCRYPTIONKEY:
    generate: "hex64"
    secret: true
    description: "The secret Noust generated for service hex 64 storageencryptionkey."
  POSTGRES_DB:
    default: "open_archive"
    description: "Setting POSTGRES_DB of the application; the template leaves it to the operator."
  SERVICE_USER_POSTGRES:
    generate: "user"
    description: "The user name Noust generated for postgres."
  SERVICE_PASSWORD_POSTGRES:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for postgres."
  SERVICE_PASSWORD_MEILISEARCH:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for meilisearch."
  SERVICE_PASSWORD_VALKEY:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for valkey."
  STORAGE_S3_ENDPOINT:
    default: ""
    description: "Setting STORAGE_S3_ENDPOINT of the application; the template leaves it to the operator."
  STORAGE_S3_BUCKET:
    default: ""
    description: "Setting STORAGE_S3_BUCKET of the application; the template leaves it to the operator."
  STORAGE_S3_ACCESS_KEY_ID:
    default: ""
    secret: true
    description: "Setting STORAGE_S3_ACCESS_KEY_ID of the application; the template leaves it to the operator."
  STORAGE_S3_SECRET_ACCESS_KEY:
    default: ""
    secret: true
    description: "Setting STORAGE_S3_SECRET_ACCESS_KEY of the application; the template leaves it to the operator."
  STORAGE_S3_REGION:
    default: ""
    description: "Setting STORAGE_S3_REGION of the application; the template leaves it to the operator."
  SERVICE_BASE64_128_JWT:
    generate: "base64_64"
    secret: true
    description: "The secret Noust generated for jwt."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    open-archiver:
      image: logiclabshq/open-archiver:v0.6.2@sha256:ec2e954959f7d0ee0089c4338437720da9b85520a23779cb6d7642943b3ae8e5
      environment:
        SERVICE_URL_OPENARCHIVER: ${SERVICE_URL_OPENARCHIVER}
        ENCRYPTION_KEY: ${SERVICE_HEX_64_ENCRYPTIONKEY}
        STORAGE_ENCRYPTION_KEY: ${SERVICE_HEX_64_STORAGEENCRYPTIONKEY}
        PORT_BACKEND: ${PORT_BACKEND:-4000}
        PORT_FRONTEND: ${PORT_FRONTEND:-3000}
        NODE_ENV: ${NODE_ENV:-production}
        SYNC_FREQUENCY: ${SYNC_FREQUENCY:-* * * * *}
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${SERVICE_USER_POSTGRES}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
        DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB}
        MEILI_MASTER_KEY: ${SERVICE_PASSWORD_MEILISEARCH}
        MEILI_HOST: http://meilisearch:7700
        REDIS_HOST: valkey
        REDIS_PORT: '6379'
        REDIS_PASSWORD: ${SERVICE_PASSWORD_VALKEY}
        REDIS_TLS_ENABLED: 'false'
        STORAGE_TYPE: ${STORAGE_TYPE:-local}
        STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH:-/var/data/open-archiver}
        BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-100M}
        STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT}
        STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET}
        STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID}
        STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY}
        STORAGE_S3_REGION: ${STORAGE_S3_REGION}
        STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
        JWT_SECRET: ${SERVICE_BASE64_128_JWT}
        JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
        RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
        RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      volumes:
        - archiver-data:/var/data/open-archiver
      depends_on:
        postgres:
          condition: service_healthy
        valkey:
          condition: service_healthy
        meilisearch:
          condition: service_healthy
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:3000
    postgres:
      image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${SERVICE_USER_POSTGRES}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
        LC_ALL: C
      volumes:
        - postgres-data:/var/lib/postgresql/data
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        interval: 10s
        timeout: 20s
        retries: 10
      restart: unless-stopped
    valkey:
      image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
      command: valkey-server --requirepass ${SERVICE_PASSWORD_VALKEY}
      volumes:
        - valkey-data:/data
      healthcheck:
        test:
          - CMD
          - redis-cli
          - ping
        interval: 10s
        timeout: 5s
        retries: 3
      restart: unless-stopped
    meilisearch:
      image: getmeili/meilisearch:v1.56@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
      environment:
        MEILI_MASTER_KEY: ${SERVICE_PASSWORD_MEILISEARCH}
      volumes:
        - meilisearch-data:/meili_data
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:7700/health
        interval: 2s
        timeout: 10s
        retries: 15
      restart: unless-stopped
  volumes:
    archiver-data:
    postgres-data:
    valkey-data:
    meilisearch-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_USER_POSTGRES and SERVICE_PASSWORD_POSTGRES and SERVICE_PASSWORD_MEILISEARCH and SERVICE_PASSWORD_VALKEY in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volumes archiver-data, postgres-data, valkey-data, meilisearch-data of this application: back them up before updating."
