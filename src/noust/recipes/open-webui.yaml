# Open WebUI from its own image. From the image's configuration
# (ghcr.io/open-webui/open-webui:v0.11.4): it runs as root, listens on 8080
# (PORT=8080), keeps its data in /app/backend/data (the volume the project's
# quick start mounts), and checks itself with /health. Settings are the
# documented WEBUI_SECRET_KEY (it signs sessions: generated once, so users stay
# signed in across updates), WEBUI_URL, ENABLE_SIGNUP and OLLAMA_BASE_URL; the
# project's compose example adds host.docker.internal:host-gateway so the
# container can reach an Ollama running on the host.
#
# The first start downloads its embedding model from the internet, which takes
# minutes: the first health gate waits ten.
schema: 2
name: open-webui
kind: compose
title: Open WebUI
slogan: A self-hosted chat interface for Ollama and OpenAI-compatible models.
description: "A feature-rich, offline-capable web interface for language models: chat, documents, retrieval and users, against Ollama or any OpenAI-compatible API."
category: ai
tags: [llm, chat, ollama, openai]
logo: logo.svg
version: "0.11.4"
revision: 1
updated: 2026-10-06
homepage: https://openwebui.com
docs: https://docs.openwebui.com
repository: https://github.com/open-webui/open-webui
license: LicenseRef-Open-WebUI
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
  - At least 4 GB of memory, and internet access for the first start
port: 8083
variables:
  WEBUI_SECRET_KEY:
    generate: password64
    description: Signs the sessions; keep it and users stay signed in across updates.
  WEBUI_URL:
    from: url
    description: The address people use.
  ENABLE_SIGNUP:
    default: "true"
    description: Whether new users can register (they wait for approval). The first one becomes the administrator.
  OLLAMA_BASE_URL:
    default: http://host.docker.internal:11434
    description: Where Ollama answers. The default is an Ollama running on this server that listens on every address; change it to any other.
health:
  path: /health
  expect: "200"
  timeout: 600
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    open-webui:
      image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
      restart: unless-stopped
      environment:
        WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
        WEBUI_URL: "${WEBUI_URL}"
        ENABLE_SIGNUP: "${ENABLE_SIGNUP}"
        OLLAMA_BASE_URL: "${OLLAMA_BASE_URL}"
      extra_hosts:
        - "host.docker.internal:host-gateway"
      volumes:
        - open-webui-data:/app/backend/data
      ports:
        - "127.0.0.1:${PORT}:8080"
  volumes:
    open-webui-data:
notes:
  - "Open {{ url }} now and sign up: the first account becomes the administrator, and until it exists anyone who reaches the page can take that role."
  - "The first start downloads the embedding model, which takes a few minutes; the health check waits for it."
  - "Connect a model server under Settings > Connections, or set OLLAMA_BASE_URL. Its data, users and uploads are in the Docker volume open-webui-data of this application."
