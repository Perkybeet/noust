# OpenGist: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/opengist
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: opengist
kind: compose
title: "OpenGist"
slogan: "Self-hosted pastebin powered by Git, open-source alternative to Github Gist."
description: "OpenGist is a self-hosted pastebin alternative."
category: development
tags: [pastebin, code, snippets, self-hosted, development]
logo: logo.svg
version: "1"
revision: 1
updated: 2026-10-28
homepage: https://opengist.io
docs: https://github.com/thomiceli/opengist
repository: https://github.com/thomiceli/opengist
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  UID:
    default: "1001"
    description: "Setting UID of the application; the template leaves it to the operator."
  GID:
    default: "1001"
    description: "Setting GID of the application; the template leaves it to the operator."
  OG_LOG_LEVEL:
    default: "info"
    description: "Setting OG_LOG_LEVEL of the application; the template leaves it to the operator."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    opengist:
      image: ghcr.io/thomiceli/opengist:1@sha256:f5dd39cc9409b4006f8b090e5f9ed042cdb736d28a06b4f985c674dacafc94d5
      restart: unless-stopped
      volumes:
        - opengist-data:/opengist
      environment:
        UID: ${UID}
        GID: ${GID}
        OG_LOG_LEVEL: ${OG_LOG_LEVEL}
      ports:
        - 127.0.0.1:${PORT}:6157
  volumes:
    opengist-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume opengist-data of this application: back it up before updating."
