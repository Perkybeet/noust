# Otter Wiki: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/otterwiki
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: otterwiki
kind: compose
title: "Otter Wiki"
slogan: "A minimalistic wiki powered by python, markdown and git."
description: "An Otter Wiki is a simple, lightweight, and fast wiki engine built with Python and Flask. It provides a user-friendly interface for creating and managing wiki content with markdown support."
category: productivity
tags: [wiki, documentation, knowledge-base, markdown, productivity]
logo: logo.svg
version: "2"
revision: 1
updated: 2026-10-28
homepage: https://otterwiki.com
docs: https://github.com/redimp/otterwiki/wiki
repository: https://github.com/redimp/otterwiki
license: MIT
architectures: ["amd64", "arm", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    otterwiki:
      image: redimp/otterwiki:2@sha256:8728fb97719414be4790bf8e9eabc345d794876dcdf55dddd164fc9eb8e0cbcb
      restart: unless-stopped
      volumes:
        - otterwiki-data:/app-data
      ports:
        - 127.0.0.1:${PORT}:80
  volumes:
    otterwiki-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume otterwiki-data of this application: back it up before updating."
