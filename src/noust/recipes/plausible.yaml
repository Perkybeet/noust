# Plausible Community Edition from the image the project publishes on ghcr.io,
# with the PostgreSQL and ClickHouse it needs in the same stack, as the compose.yml
# of github.com/plausible/community-edition at the v3.2.1 tag has them, and its
# configuration wiki names the settings: BASE_URL (the public address),
# SECRET_KEY_BASE (at least 64 bytes), TOTP_VAULT_KEY, DISABLE_REGISTRATION,
# DATABASE_URL and CLICKHOUSE_DATABASE_URL. The command creates and migrates both
# databases before it starts, TMPDIR sits in the data volume, and the four small
# ClickHouse configuration files that make it use less memory and bind to IPv4
# are the project's own, shipped unchanged (that repository is MIT licensed).
# The image runs as user 999 and listens on 8000. PostgreSQL and ClickHouse are the
# series the project's compose file names (16 and 24.12); the ClickHouse container is
# only reachable from the stack. /api/health tests both databases and needs no login.
#
# Names and marks: Plausible Insights OU's trademark guidelines
# (plausible.io/trademark, read 2026-10-06) allow naming the product to refer to it
# and to indicate compatibility, and forbid the logos and any suggestion of
# endorsement; so this recipe uses only a Noust monogram, says it is not affiliated,
# and hosts nothing for anyone. The software is AGPL-3.0-or-later.
#
# This recipe replaces a listing that waited for ClickHouse and for the question of
# the name to be settled. Pinned to the release tag and to the digest ghcr.io serves
# for it.
schema: 2
name: plausible
kind: compose
title: Plausible Analytics Community Edition
slogan: Lightweight, privacy-friendly web analytics, self-hosted.
description: "Cookie-free web analytics with one small script and one dashboard. Runs the community edition with its own PostgreSQL and ClickHouse, which needs at least 2 GB of memory. Independent packaging by Noust: not affiliated with or endorsed by Plausible Insights OU."
category: analytics
tags: [analytics, privacy, statistics, clickhouse]
logo: logo.svg
version: "3.2.1"
revision: 1
updated: 2026-10-06
homepage: https://plausible.io
docs: https://github.com/plausible/community-edition
repository: https://github.com/plausible/analytics
license: AGPL-3.0-or-later
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
  - A CPU with SSE 4.2 or NEON, and at least 2 GB of memory (ClickHouse)
port: 8000
variables:
  BASE_URL:
    from: url
    description: The address people use; it must be the real domain, for the tracking script and e-mail links.
  SECRET_KEY_BASE:
    generate: base64_64
    description: Signs sessions; at least 64 bytes. Changing it signs everybody out.
  TOTP_VAULT_KEY:
    generate: base64_32
    description: Encrypts the two-factor secrets. Losing it locks out the accounts that use them.
  DISABLE_REGISTRATION:
    default: invite_only
    description: true, false or invite_only. invite_only lets the first person register and everybody else only by invitation.
  DB_PASSWORD:
    generate: password32
    description: The password of the stack's PostgreSQL account.
health:
  path: /api/health
  expect: "200"
  timeout: 240
compose: |
  services:
    plausible:
      image: ghcr.io/plausible/community-edition:v3.2.1@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
      restart: unless-stopped
      command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
      depends_on:
        plausible_db:
          condition: service_healthy
        plausible_events_db:
          condition: service_healthy
      environment:
        TMPDIR: /var/lib/plausible/tmp
        BASE_URL: "${BASE_URL}"
        SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
        TOTP_VAULT_KEY: "${TOTP_VAULT_KEY}"
        DISABLE_REGISTRATION: "${DISABLE_REGISTRATION}"
        DATABASE_URL: "postgres://plausible:${DB_PASSWORD}@plausible_db:5432/plausible"
        CLICKHOUSE_DATABASE_URL: "http://plausible_events_db:8123/plausible_events"
        # Passed through from the application's environment when the operator sets
        # them (the project's compose file does the same): e-mail needs an SMTP server.
        MAILER_ADAPTER:
        MAILER_EMAIL:
        MAILER_NAME:
        SMTP_HOST_ADDR:
        SMTP_HOST_PORT:
        SMTP_USER_NAME:
        SMTP_USER_PWD:
        SMTP_HOST_SSL_ENABLED:
      ulimits:
        nofile:
          soft: 65535
          hard: 65535
      volumes:
        - plausible-data:/var/lib/plausible
      ports:
        - "127.0.0.1:${PORT}:8000"
    plausible_db:
      image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      restart: unless-stopped
      environment:
        POSTGRES_USER: plausible
        POSTGRES_DB: plausible
        POSTGRES_PASSWORD: "${DB_PASSWORD}"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U plausible -d plausible"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s
      volumes:
        - plausible-db:/var/lib/postgresql/data
    plausible_events_db:
      image: clickhouse/clickhouse-server:24.12.6.70-alpine@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
      restart: unless-stopped
      environment:
        CLICKHOUSE_SKIP_USER_SETUP: "1"
      healthcheck:
        test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 60s
      ulimits:
        nofile:
          soft: 262144
          hard: 262144
      volumes:
        - plausible-events:/var/lib/clickhouse
        - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
        - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
        - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
        - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
  volumes:
    plausible-data:
    plausible-db:
    plausible-events:
files:
  clickhouse/logs.xml: clickhouse/logs.xml
  clickhouse/ipv4-only.xml: clickhouse/ipv4-only.xml
  clickhouse/low-resources.xml: clickhouse/low-resources.xml
  clickhouse/default-profile-low-resources-overrides.xml: clickhouse/default-profile-low-resources-overrides.xml
notes:
  - "Open {{ url }}/register now and create your account: the first person to register becomes the owner, and after that registration is by invitation only."
  - "Add the script it gives you to the sites you want to measure. E-mail (invitations, reports, password resets) needs an SMTP server: set MAILER_ADAPTER=Bamboo.SMTPAdapter, MAILER_EMAIL, SMTP_HOST_ADDR, SMTP_HOST_PORT, SMTP_USER_NAME and SMTP_USER_PWD in the application's environment (the project's wiki lists them), then noust restart {{ domain }}."
  - "Settings and accounts are in the PostgreSQL of this stack (Docker volume plausible-db, dumped by Noust before every update). The visits themselves are in ClickHouse (volume plausible-events), which Noust does not dump: back that volume up before updating."
