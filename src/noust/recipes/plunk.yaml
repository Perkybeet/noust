# Plunk: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/plunk.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: plunk
kind: compose
title: "Plunk"
slogan: "Plunk, The Open-Source Email Platform for AWS"
description: "Plunk is the open-source, affordable email platform that brings together marketing, transactional and broadcast emails into one single, complete solution"
category: automation
tags: [plunk, email, automation, aws, newsletter, mailing-list, marketing]
logo: logo.svg
version: "1.3.6"
revision: 1
updated: 2026-10-30
homepage: https://www.useplunk.com
docs: https://docs.useplunk.com/getting-started/introduction
repository: https://github.com/useplunk/plunk
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_PLUNK:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_USER_POSTGRES:
    generate: "user"
    description: "The user name Noust generated for postgres."
  SERVICE_PASSWORD_POSTGRES:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for postgres."
  SERVICE_PASSWORD_JWTSECRET:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for jwtsecret."
  AWS_REGION:
    required: true
    description: "Needed to start the application; the installation asks for it."
  AWS_ACCESS_KEY_ID:
    required: true
    description: "Needed to start the application; the installation asks for it."
  AWS_SECRET_ACCESS_KEY:
    required: true
    description: "Needed to start the application; the installation asks for it."
  AWS_SES_CONFIGURATION_SET:
    required: true
    description: "Needed to start the application; the installation asks for it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    plunk:
      image: driaug/plunk:1.3.6@sha256:85e7fc843327318741c92e744cf05856aa3f28ac9f01e4ed3fb0a2592524d0a2
      depends_on:
        postgresql:
          condition: service_healthy
        redis:
          condition: service_healthy
      environment:
        SERVICE_URL_PLUNK: ${SERVICE_URL_PLUNK}
        REDIS_URL: redis://redis:6379
        DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgresql/plunk-db?schema=public
        JWT_SECRET: ${SERVICE_PASSWORD_JWTSECRET}
        AWS_REGION: ${AWS_REGION:?}
        AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
        AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
        AWS_SES_CONFIGURATION_SET: ${AWS_SES_CONFIGURATION_SET:?}
        NEXT_PUBLIC_API_URI: ${SERVICE_URL_PLUNK}/api
        APP_URI: ${SERVICE_URL_PLUNK}
        API_URI: ${SERVICE_URL_PLUNK}/api
        DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-False}
        NODE_OPTIONS: --no-network-family-autoselection
      entrypoint:
        - /app/entry.sh
      healthcheck:
        test:
          - CMD-SHELL
          - (wget -S --spider http://127.0.0.1:3000/api/health 2>&1 | grep -q "HTTP/1.1 [1-3]")
        interval: 2s
        timeout: 10s
        retries: 15
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:3000
    postgresql:
      image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
      environment:
        POSTGRES_USER: ${SERVICE_USER_POSTGRES}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
        POSTGRES_DB: ${POSTGRES_DB:-plunk-db}
      volumes:
        - plunk-postgresql-data:/var/lib/postgresql/data
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        interval: 5s
        timeout: 20s
        retries: 10
      restart: unless-stopped
    redis:
      image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
      volumes:
        - plunk-redis-data:/data
      healthcheck:
        test:
          - CMD
          - redis-cli
          - PING
        interval: 5s
        timeout: 10s
        retries: 20
      restart: unless-stopped
  volumes:
    plunk-postgresql-data:
    plunk-redis-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_USER_POSTGRES and SERVICE_PASSWORD_POSTGRES and SERVICE_PASSWORD_JWTSECRET in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volumes plunk-postgresql-data, plunk-redis-data of this application: back them up before updating."
