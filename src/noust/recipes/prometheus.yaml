# Prometheus: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/prometheus
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: prometheus
kind: compose
title: "Prometheus"
slogan: "The Prometheus monitoring system and time series database."
description: "Prometheus is an open-source monitoring and alerting toolkit that collects metrics from your systems. Self-host it on your own server with Dokploy, which deploys Prometheus as a Docker Compose service in a few clicks."
category: monitoring
tags: [monitoring, alerting, metrics]
logo: simple-icons:prometheus
version: "3.15.1"
revision: 1
updated: 2026-10-28
homepage: https://prometheus.io/
docs: https://prometheus.io/docs/introduction/overview/
repository: https://github.com/prometheus/prometheus
license: Apache-2.0
architectures: ["amd64", "arm", "arm64", "riscv64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
health: {path: /, expect: "200-399", timeout: 180}
files:
  files/prometheus.yml:
    asset: files/prometheus.yml
    mode: "0644"
compose: |
  services:
    prometheus:
      image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
      restart: unless-stopped
      command:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --web.console.libraries=/usr/share/prometheus/console_libraries
        - --web.console.templates=/usr/share/prometheus/consoles
        - --web.enable-lifecycle
      volumes:
        - ./files/prometheus.yml:/etc/prometheus/prometheus.yml
        - prometheus-data:/prometheus
      ports:
        - 127.0.0.1:${PORT}:9090
  volumes:
    prometheus-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume prometheus-data of this application: back it up before updating."
