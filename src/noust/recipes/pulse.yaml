# Pulse: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/pulse
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: pulse
kind: compose
title: "Pulse"
slogan: "Real-time monitoring dashboard for Proxmox VE, PBS, Docker, Kubernetes, TrueNAS and vSphere."
description: "A responsive monitoring platform for Proxmox VE, PBS, and Docker with real-time metrics across nodes and containers."
category: monitoring
tags: [monitoring, proxmox, docker, metrics]
logo: logo.svg
version: "5.1"
revision: 1
updated: 2026-10-28
homepage: https://pulserelay.pro
docs: https://github.com/rcourtman/Pulse/blob/main/docs/README.md
repository: https://github.com/rcourtman/Pulse
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  PULSE_AUTH_USER:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for pulse auth user."
  PULSE_AUTH_PASS:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for pulse auth pass."
health: {path: /, expect: "200-399", timeout: 180}
root_equivalent: docker_socket
compose: |
  services:
    pulse:
      image: rcourtman/pulse:5.1@sha256:5c5e9a27c28fb5694bebfb60c875b610dc8e795e4d7484e705c10c4286808fb3
      restart: unless-stopped
      volumes:
        - pulse_data:/data
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        PULSE_AUTH_USER: ${PULSE_AUTH_USER}
        PULSE_AUTH_PASS: ${PULSE_AUTH_PASS}
      healthcheck:
        test:
          - CMD
          - wget
          - --no-verbose
          - --tries=1
          - --spider
          - http://localhost:7655/api/health
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s
      ports:
        - 127.0.0.1:${PORT}:7655
  volumes:
    pulse_data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "Pulse controls the Docker daemon of this server, which is the same as root on it: it can start any container with any part of the server mounted, Noust's applications included. Give its sign-in only to people you would give root."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume pulse_data of this application: back it up before updating."
