# Radarr from the image linuxserver.io publishes (ghcr.io/linuxserver/radarr), run as its
# documentation describes (docs.linuxserver.io/images/docker-radarr, read 2026-10-20): the
# configuration under /config, PUID, PGID and TZ for the account the process runs as, the
# interface on 7878; the *arr applications answer /ping without a sign-in.
# The image's s6 init changes the ownership of /config only, so a directory it writes to as
# somebody other than root has to belong to PUID: the defaults here run as root inside the
# container (PUID and PGID 0), which writes anywhere the operator mounts and nowhere else.
# Since version 4 the first visit asks for the account that protects the interface.
#
# Pinned to the release tag and to the digest ghcr.io serves for it.
schema: 2
name: radarr
kind: compose
title: Radarr
slogan: "A PVR for movies: it watches for the releases you want and organises them."
description: "Keep a list of the movies you want, and Radarr looks for each release, hands it to your download client and files it into your library with the right names. Part of the *arr family, with the same interface as Sonarr."
category: media
tags: [movies, media, automation, pvr]
logo: logo.svg
version: "6.4.4.10685"
revision: 1
updated: 2026-10-20
homepage: https://radarr.video
docs: https://wiki.servarr.com/radarr
repository: https://github.com/Radarr/Radarr
license: GPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 7878
variables:
  PUID:
    default: "0"
    description: The user ID the process runs as inside the container. 0 is root; use the owner of your library to keep its files yours.
  PGID:
    default: "0"
    description: The group ID the process runs as inside the container.
  TZ:
    default: UTC
    description: The time zone, such as Europe/Madrid.
  MOVIES_PATH:
    default: ./movies
    description: "Your movie library. Inside the application by default; give an absolute path to use a library elsewhere."
  DOWNLOADS_PATH:
    default: ./downloads
    description: "Where your download client puts what it fetches. Inside the application by default; give an absolute path to share it with the client."
health:
  path: /ping
  expect: "200"
  timeout: 120
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    radarr:
      image: ghcr.io/linuxserver/radarr:6.4.4.10685-ls322@sha256:ff4430fe2d6159b4dbaac9903acfecee5aa68dec8c929259e2f3114c63f7a09e
      restart: unless-stopped
      environment:
        PUID: "${PUID}"
        PGID: "${PGID}"
        TZ: "${TZ}"
      volumes:
        - radarr-config:/config
        - "${MOVIES_PATH}:/movies"
        - "${DOWNLOADS_PATH}:/downloads"
      ports:
        - "127.0.0.1:${PORT}:7878"
  volumes:
    radarr-config:
notes:
  - "Open {{ url }} now: the first visit asks for the user name and password that protect Radarr, and until you set them anybody who reaches the page can."
  - "Its settings and database are in the Docker volume radarr-config of this application: back it up before updating."
  - "Put your libraries where MOVIES_PATH point (inside {{ app_path }} by default) and restart the application after changing them: noust restart {{ domain }}. The paths must be the ones Sonarr, Radarr and your download client see, so that files are found where they are said to be."
