# Snipe-IT: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/snipe-it.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: snipe-it
kind: compose
title: "Snipe-IT"
slogan: "Snipe-IT is an open-source asset management platform built for IT departments."
description: "Snipe-IT is an open-source IT asset management system for tracking hardware, software licenses, and more. Self-host it on your own server with Dokploy, which deploys Snipe-IT as a Docker Compose service in a few clicks."
category: utilities
tags: [inventory, open-source, asset-management, business, self-hosted, utilities]
logo: logo.svg
version: "8.7.1"
revision: 1
updated: 2026-10-28
homepage: https://snipeitapp.com
docs: https://snipe-it.readme.io/docs/introduction
repository: https://github.com/grokability/snipe-it
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_SNIPEIT:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_REALBASE64_32_APPKEY:
    generate: "base64_32"
    secret: true
    description: "The secret Noust generated for appkey."
  SERVICE_USER_MARIADB:
    generate: "user"
    description: "The user name Noust generated for mariadb."
  SERVICE_PASSWORD_MARIADB:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for mariadb."
  SERVICE_PASSWORD_ROOT:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for root."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    app:
      image: snipe/snipe-it:v8.7.1@sha256:2970d30dc4dcd131858bc530edc08ca0d31f22052e5008862676bc49bf785160
      environment:
        SERVICE_URL_SNIPEIT: ${SERVICE_URL_SNIPEIT}
        APP_ENV: production
        APP_DEBUG: 'false'
        APP_KEY: base64:${SERVICE_REALBASE64_32_APPKEY}
        APP_URL: ${SERVICE_URL_SNIPEIT}
        APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
        APP_LOCALE: ${APP_LOCALE:-en-US}
        DB_CONNECTION: mysql
        DB_HOST: mariadb
        DB_PORT: '3306'
        DB_DATABASE: ${MYSQL_DATABASE:-snipeit}
        DB_USERNAME: ${SERVICE_USER_MARIADB}
        DB_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
        MAIL_MAILER: ${MAIL_MAILER:-smtp}
        MAIL_HOST: ${MAIL_HOST:-null}
        MAIL_PORT: ${MAIL_PORT:-1025}
        MAIL_USERNAME: ${MAIL_USERNAME:-null}
        MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
        MAIL_FROM_ADDR: ${MAIL_FROM_ADDR:-you@example.com}
        MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Snipe-IT}
      volumes:
        - storage:/var/lib/snipeit
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://localhost/health
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      depends_on:
        mariadb:
          condition: service_healthy
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:80
    mariadb:
      image: mariadb:11.8@sha256:c4124d1afa875e47f2892edf26b482fa54f796e2f342d3717a04ca091a22a9bd
      environment:
        MYSQL_DATABASE: ${MYSQL_DATABASE:-snipeit}
        MYSQL_USER: ${SERVICE_USER_MARIADB}
        MYSQL_PASSWORD: ${SERVICE_PASSWORD_MARIADB}
        MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_ROOT}
      volumes:
        - db_data:/var/lib/mysql
      healthcheck:
        test:
          - CMD
          - healthcheck.sh
          - --connect
          - --innodb_initialized
        interval: 5s
        timeout: 1s
        retries: 5
      restart: unless-stopped
  volumes:
    storage:
    db_data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_USER_MARIADB and SERVICE_PASSWORD_MARIADB and SERVICE_PASSWORD_ROOT in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volumes storage, db_data of this application: back them up before updating."
