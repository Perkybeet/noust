# Sonarr from the image linuxserver.io publishes (ghcr.io/linuxserver/sonarr), run as its
# documentation describes (docs.linuxserver.io/images/docker-sonarr, read 2026-10-20): the
# configuration under /config, PUID, PGID and TZ for the account the process runs as, the
# interface on 8989; the *arr applications answer /ping without a sign-in.
# The image's s6 init changes the ownership of /config only, so a directory it writes to as
# somebody other than root has to belong to PUID: the defaults here run as root inside the
# container (PUID and PGID 0), which writes anywhere the operator mounts and nowhere else.
# Since version 4 the first visit asks for the account that protects the interface.
#
# Pinned to the release tag and to the digest ghcr.io serves for it.
schema: 2
name: sonarr
kind: compose
title: Sonarr
slogan: "A PVR for TV series: it watches for new episodes and organises them."
description: "Follow the series you want, and Sonarr looks for each new episode, hands it to your download client and files it into your library with the right names. Part of the *arr family, with the same interface as Radarr."
category: media
tags: [tv, media, automation, pvr]
logo: logo.svg
version: "4.0.20.3014"
revision: 1
updated: 2026-10-20
homepage: https://sonarr.tv
docs: https://wiki.servarr.com/sonarr
repository: https://github.com/Sonarr/Sonarr
license: GPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 8989
variables:
  PUID:
    default: "0"
    description: The user ID the process runs as inside the container. 0 is root; use the owner of your library to keep its files yours.
  PGID:
    default: "0"
    description: The group ID the process runs as inside the container.
  TZ:
    default: UTC
    description: The time zone, such as Europe/Madrid.
  TV_PATH:
    default: ./tv
    description: "Your TV library. Inside the application by default; give an absolute path to use a library elsewhere."
  DOWNLOADS_PATH:
    default: ./downloads
    description: "Where your download client puts what it fetches. Inside the application by default; give an absolute path to share it with the client."
health:
  path: /ping
  expect: "200"
  timeout: 120
files: {noust.nginx.yaml: noust.nginx.yaml}
compose: |
  services:
    sonarr:
      image: ghcr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
      restart: unless-stopped
      environment:
        PUID: "${PUID}"
        PGID: "${PGID}"
        TZ: "${TZ}"
      volumes:
        - sonarr-config:/config
        - "${TV_PATH}:/tv"
        - "${DOWNLOADS_PATH}:/downloads"
      ports:
        - "127.0.0.1:${PORT}:8989"
  volumes:
    sonarr-config:
notes:
  - "Open {{ url }} now: the first visit asks for the user name and password that protect Sonarr, and until you set them anybody who reaches the page can."
  - "Its settings and database are in the Docker volume sonarr-config of this application: back it up before updating."
  - "Put your libraries where TV_PATH point (inside {{ app_path }} by default) and restart the application after changing them: noust restart {{ domain }}. The paths must be the ones Sonarr, Radarr and your download client see, so that files are found where they are said to be."
