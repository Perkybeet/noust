# Steedos: Derived in part from Dokploy's template https://github.com/Dokploy/templates/tree/main/blueprints/steedos
# (MIT, Copyright 2024 Dokploy and Carlos Ortiz), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: steedos
kind: compose
title: "Steedos"
slogan: "The AI-Native Infrastructure for Enterprise Apps."
description: "Steedos is an open-source low-code platform and alternative to Salesforce, designed to help you build enterprise applications like CRM with clicks, not code."
category: backend
tags: [crm, low-code, backend]
logo: logo.svg
version: "3.0.14"
revision: 1
updated: 2026-10-28
homepage: https://www.objectstack.ai
docs: https://docs.steedos.com/
repository: https://github.com/steedos/steedos-platform
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  STEEDOS_HOST:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    steedos:
      image: steedos/steedos-community:3.0.14@sha256:f8bcd584dc698ae252c33f7a791e54b4a4f1dea2d6b7cdb318a9ceba4bd8faa8
      restart: unless-stopped
      environment:
        ROOT_URL: http://${STEEDOS_HOST}
      volumes:
        - steedos-data:/steedos-storage
      ports:
        - 127.0.0.1:${PORT}:80
  volumes:
    steedos-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume steedos-data of this application: back it up before updating."
