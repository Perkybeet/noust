unavailable_reason: "Its self-hosting file (docker/docker-compose.yml, v1.26.08, read 2026-10-06) has 11 services with their configuration files, gives Realtime a container_name because 'realtime constructs tenant id by parsing the subdomain' of it, and nests variable references (PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}); a recipe may set neither container_name nor a nested reference, and a transcription that could not run here would drift from a file that changes with every release. Not available in this release."
