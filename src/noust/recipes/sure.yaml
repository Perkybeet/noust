# Sure: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/sure.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: sure
kind: compose
title: "Sure"
slogan: "An all-in-one personal finance platform."
description: "An all-in-one personal finance platform."
category: business
tags: [budgeting, budget, money, expenses, income, business]
logo: logo.svg
version: "0.7.5"
revision: 1
updated: 2026-10-30
homepage: https://sure.am
docs: https://github.com/we-promise/sure
repository: https://github.com/we-promise/sure
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_SURE:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_FQDN_SURE:
    from: "fqdn"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_BASE64_BASE:
    generate: "base64_32"
    secret: true
    description: "The secret Noust generated for base."
  SERVICE_USER_POSTGRESQL:
    generate: "user"
    description: "The user name Noust generated for postgresql."
  SERVICE_PASSWORD_POSTGRESQL:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for postgresql."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    web:
      image: ghcr.io/we-promise/sure:0.7.5@sha256:46c0cedf89cf5c801f91ced894d1d1e6e401b6352fe1b5b4ba242f9b192a5807
      environment:
        SERVICE_URL_SURE: ${SERVICE_URL_SURE}
        APP_DOMAIN: ${SERVICE_FQDN_SURE}
        SECRET_KEY_BASE: ${SERVICE_BASE64_BASE}
        POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}
        POSTGRES_DB: ${POSTGRESQL_DATABASE:-sure}
        REDIS_URL: redis://valkey:6379
        DB_HOST: postgresql
        DB_PORT: '5432'
        SELF_HOSTED: 'true'
        RAILS_FORCE_SSL: 'false'
        RAILS_ASSUME_SSL: 'false'
        ONBOARDING_STATE: ${ONBOARDING_STATE:-open}
      depends_on:
        postgresql:
          condition: service_healthy
        valkey:
          condition: service_healthy
      volumes:
        - sure-app-storage:/rails/storage
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:3000
        interval: 15s
        timeout: 20s
        retries: 5
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:3000
    worker:
      image: ghcr.io/we-promise/sure:0.7.5@sha256:46c0cedf89cf5c801f91ced894d1d1e6e401b6352fe1b5b4ba242f9b192a5807
      command: bundle exec sidekiq
      environment:
        APP_DOMAIN: ${SERVICE_FQDN_SURE}
        SECRET_KEY_BASE: ${SERVICE_BASE64_BASE}
        POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}
        POSTGRES_DB: ${POSTGRESQL_DATABASE:-sure}
        REDIS_URL: redis://valkey:6379
        DB_HOST: postgresql
        DB_PORT: '5432'
        SELF_HOSTED: 'true'
        RAILS_FORCE_SSL: 'false'
        RAILS_ASSUME_SSL: 'false'
        ONBOARDING_STATE: ${ONBOARDING_STATE:-open}
      volumes:
        - sure-app-storage:/rails/storage
      depends_on:
        postgresql:
          condition: service_healthy
        valkey:
          condition: service_healthy
      healthcheck:
        test:
          - CMD
          - curl
          - -f
          - http://127.0.0.1:3000
        interval: 15s
        timeout: 20s
        retries: 5
      restart: unless-stopped
    postgresql:
      image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
      volumes:
        - sure-postgresql-data:/var/lib/postgresql/data
      environment:
        POSTGRES_USER: ${SERVICE_USER_POSTGRESQL}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRESQL}
        POSTGRES_DB: ${POSTGRESQL_DATABASE:-sure}
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        interval: 5s
        timeout: 20s
        retries: 10
      restart: unless-stopped
    valkey:
      image: valkey/valkey:8-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
      command: valkey-server --appendonly yes
      volumes:
        - sure-valkey:/data
      healthcheck:
        test:
          - CMD-SHELL
          - valkey-cli ping | grep PONG
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 3s
      restart: unless-stopped
  volumes:
    sure-app-storage:
    sure-postgresql-data:
    sure-valkey:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_USER_POSTGRESQL and SERVICE_PASSWORD_POSTGRESQL in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volumes sure-app-storage, sure-postgresql-data, sure-valkey of this application: back them up before updating."
