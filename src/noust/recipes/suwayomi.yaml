# Suwayomi from the image the project publishes (ghcr.io/suwayomi/tachidesk), with the variables and folder its documentation names (github.com/Suwayomi/Suwayomi-Server, wiki: Docker).
schema: 2
name: suwayomi
kind: compose
title: "Suwayomi"
slogan: "A free and open source manga reader server that runs extensions built for Mihon."
description: "Reads manga from the sources of Mihon extensions on a server, keeps a library, tracks progress and downloads chapters, from the browser or an app. Protected by a user name and a password Noust generates."
category: media
tags: [manga, reader, library, comics]
logo: logo.svg
version: "2.4.2435"
revision: 1
updated: 2026-10-30
homepage: https://github.com/Suwayomi/Suwayomi-Server
docs: https://github.com/Suwayomi/Suwayomi-Server
repository: https://github.com/Suwayomi/Suwayomi-Server
license: MPL-2.0
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 4567
variables:
  ADMIN_PASSWORD:
    generate: "password32"
    description: "The password of the user admin."
health: {path: /, expect: "200-399,401", timeout: 120}
compose: |
  services:
    suwayomi:
      image: ghcr.io/suwayomi/tachidesk:v2.4.2435@sha256:ca891c0a6915666d6a79f16b0119c52a63507d840e14dca0e8dbcc163f60d8b3
      restart: unless-stopped
      environment:
        TZ: UTC
        AUTH_MODE: basic_auth
        AUTH_USERNAME: admin
        AUTH_PASSWORD: ${ADMIN_PASSWORD}
      volumes:
        - suwayomi-data:/home/suwayomi/.local/share/Tachidesk
      ports:
        - 127.0.0.1:${PORT}:4567
  volumes:
    suwayomi-data:
notes:
  - "Open {{ url }}. Sign in as admin with the password in ADMIN_PASSWORD (noust env show {{ domain }} --unmask)."
  - "Its data is in the Docker volume suwayomi-data of this application: back it up before updating."
