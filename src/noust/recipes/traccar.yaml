# Traccar: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/traccar.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: traccar
kind: compose
title: "Traccar"
slogan: "Traccar is a free and open source modern GPS tracking system."
description: "Open-source GPS tracking platform."
category: smart-home
tags: [traccar, gps, tracking, open, source, smart-home]
logo: simple-icons:traccar
version: "6.16.0"
revision: 1
updated: 2026-10-31
homepage: https://www.traccar.org
docs: https://www.traccar.org/documentation/
repository: https://github.com/traccar/traccar
license: Apache-2.0
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_TRACCAR:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_URL_TRACCARAPI:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
  SERVICE_USER_POSTGRES:
    generate: "user"
    description: "The user name Noust generated for postgres."
  SERVICE_PASSWORD_POSTGRES:
    generate: "password32"
    secret: true
    description: "The secret Noust generated for postgres."
health: {path: /, expect: "200-399", timeout: 180}
files:
  files/traccar/traccar.xml:
    asset: files/traccar/traccar.xml
    mode: "0644"
compose: |
  services:
    traccar:
      image: traccar/traccar:6.16.0@sha256:03ebb7ed2b219d4f25c326873bd022f5062f80bcae622a9d9422846b51951eda
      environment:
        SERVICE_URL_TRACCAR: ${SERVICE_URL_TRACCAR}
        SERVICE_URL_TRACCARAPI: ${SERVICE_URL_TRACCARAPI}
        CONFIG_USE_ENVIRONMENT_VARIABLES: ${CONFIG_USE_ENVIRONMENT_VARIABLES:-true}
        DATABASE_USER: ${SERVICE_USER_POSTGRES}
        DATABASE_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      volumes:
        - ./files/traccar/traccar.xml:/opt/traccar/conf/traccar.xml
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test:
          - CMD
          - wget
          - --no-verbose
          - --tries=1
          - --spider
          - http://127.0.0.1:8082
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:8082
    postgres:
      image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
      environment:
        POSTGRES_USER: ${SERVICE_USER_POSTGRES}
        POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
        POSTGRES_DB: ${POSTGRESQL_DATABASE:-traccar}
      volumes:
        - traccar-postgresql-data:/var/lib/postgresql/data
      healthcheck:
        test:
          - CMD-SHELL
          - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
        interval: 5s
        timeout: 20s
        retries: 10
      restart: unless-stopped
  volumes:
    traccar-postgresql-data:
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "The user name and the password Noust generated for the application are SERVICE_USER_POSTGRES and SERVICE_PASSWORD_POSTGRES in its environment (noust env show {{ domain }} --unmask); the application's own sign-in may use them or ask you to create an account."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
  - "Its data is in the Docker volume traccar-postgresql-data of this application: back it up before updating."
