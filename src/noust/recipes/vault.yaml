# HashiCorp Vault has an official image (hashicorp/vault) and is under HashiCorp's
# Business Source License, which is why it is listed and not installable. OpenBao
# (openbao.yaml) is the open fork that replaces it in the catalogue.
schema: 2
name: vault
kind: compose
title: Vault
slogan: Secrets management, encryption as a service and privileged access.
description: "A tool for securely accessing secrets: API keys, passwords and certificates, with leasing, revocation, audit logging and encryption as a service."
category: security
tags: [secrets, encryption, pki, hashicorp]
logo: simple-icons:vault
homepage: https://developer.hashicorp.com/vault
docs: https://developer.hashicorp.com/vault/docs
repository: https://github.com/hashicorp/vault
license: BUSL-1.1
available: false
unavailable_code: licence
replaced_by: openbao
unavailable_reason: "Vault is under HashiCorp's Business Source License (LICENSE in the repository, read 2026-10-06), which is not a licence that lets an operator run it for others. OpenBao, the Linux Foundation's open fork under the Mozilla Public License, is the catalogue's answer: same API and same opening ceremony, which its recipe walks. Not available in this release."
