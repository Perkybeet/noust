# WBO from the image the project publishes (lovasoa/wbo), with the folder its documentation names (github.com/lovasoa/whitebophir, README: Running with Docker).
schema: 2
name: wbo
kind: compose
title: "WBO"
slogan: "Online collaborative whiteboard that is simple, free and easy to use."
description: "A whiteboard that several people draw on at once, with pens, shapes, text and sticky notes, at an address per board. No accounts and no sign-in: whoever has a board's address can draw on it."
category: productivity
tags: [whiteboard, collaboration, drawing, realtime]
logo: logo.svg
version: "2.18.31"
revision: 1
updated: 2026-10-30
homepage: https://wbo.ophir.dev
docs: https://wbo.ophir.dev
repository: https://github.com/lovasoa/whitebophir
license: AGPL-3.0-only
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
health: {path: /, expect: "200-399", timeout: 120}
compose: |
  services:
    wbo:
      image: lovasoa/wbo:v2.18.31@sha256:70140dbee4f2220df3c8d8413eaeca8d8e242a34f7fc719de69aa780b4356930
      restart: unless-stopped
      volumes:
        - wbo-boards:/opt/app/server-data
      ports:
        - 127.0.0.1:${PORT}:80
      user: 0:0
  volumes:
    wbo-boards:
notes:
  - "Open {{ url }}. Nothing to set up: open it, and share the address of a board. There are no accounts: anyone who reaches the page can make boards."
  - "Its data is in the Docker volume wbo-boards of this application: back it up before updating."
