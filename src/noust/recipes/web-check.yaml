# Web Check: Derived in part from Coolify's template https://github.com/coollabsio/coolify/blob/next/templates/compose/web-check.yaml
# (Apache-2.0, Copyright 2025 Andras Bacsai), changed into a recipe: every image pinned to a release and the
# digest its registry serves, the web port on the loopback address, credentials generated,
# and nothing the closed schema refuses. The template's authors keep their rights in it.
schema: 2
name: web-check
kind: compose
title: "Web Check"
slogan: "All-in-one OSINT tool for analysing any website"
description: "Web-Check is a powerful all-in-one website analyzer that provides detailed insights into any website's security, performance, and functionality."
category: security
tags: [osint, website, analysis, website-analyzer, security, performance, seo]
logo: logo.svg
version: "2.3.11"
revision: 1
updated: 2026-10-31
homepage: https://web-check.xyz
docs: https://github.com/lissy93/web-check
repository: https://github.com/lissy93/web-check
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 3000
variables:
  SERVICE_URL_WEBCHECK:
    from: "url"
    description: "The address people use to reach the application, as the template builds it."
health: {path: /, expect: "200-399", timeout: 180}
compose: |
  services:
    web-check:
      image: lissy93/web-check:2.3.11@sha256:6fe1535bb4374c566f2e8eb38c455e91eb226a6af829054a13320071e09972ab
      environment:
        SERVICE_URL_WEBCHECK: ${SERVICE_URL_WEBCHECK}
      healthcheck:
        test:
          - CMD-SHELL
          - wget -qO- http://127.0.0.1:3000/
        interval: 5s
        timeout: 20s
        retries: 10
      restart: unless-stopped
      ports:
        - 127.0.0.1:${PORT}:3000
notes:
  - "Open {{ url }}. The first start can take a minute while the application prepares itself."
  - "If the application asks you to create the first account, do it right after installing: until someone does, the first visitor can."
  - "Settings that Noust generated are in this application's environment (noust env show {{ domain }}); secrets are masked there, and --unmask shows them."
