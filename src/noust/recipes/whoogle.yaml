# Whoogle Search is listed and not installable since its project ended: the README of
# benbusby/whoogle-search says on its first lines that Whoogle no longer returns results, because
# Google closed the page it fetched them from and the paid API it fell back on, and the repository
# is archived (README and GitHub, read 2026-11-01). The smoke test of 2026-10-30 (the container up
# and /healthz answering) passed at 1.2.4, and says nothing of whether Google returns results.
schema: 2
name: whoogle
kind: compose
title: "Whoogle Search"
slogan: "A self-hosted, ad-free, privacy-respecting metasearch engine."
description: "Google results without ads, JavaScript, AMP links, cookies or tracking, fetched by your server. Listed because it no longer works: Google closed the way it fetched results, and its project has ended and is archived."
category: search
tags: [search, privacy, proxy, metasearch]
logo: logo.png
version: "1.2.4"
updated: 2026-11-01
homepage: https://pypi.org/project/whoogle-search/
docs: https://pypi.org/project/whoogle-search/
repository: https://github.com/benbusby/whoogle-search
license: MIT
available: false
unavailable_code: archived
replaced_by: searxng
unavailable_reason: "Its README opens with 'Whoogle has reached the end of the road' (24 Jul 2026): 'Whoogle no longer returns search results, and that isn't something this project can fix', because Google banned the last User-Agent string that fetched results without JavaScript and the Google Custom Search fallback is closed too; it announces no further commits, releases, bug fixes or support for existing deployments and Docker images (README of benbusby/whoogle-search at main, read 2026-11-01). The repository is archived (GitHub, read 2026-11-01) and the last release, v1.2.4, is from 2026-04-15. A recipe does not install a search engine that returns no search results. Not available in this release."
