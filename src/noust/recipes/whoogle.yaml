# Whoogle Search from the image the project publishes (benbusby/whoogle-search), with the settings its documentation names (github.com/benbusby/whoogle-search, README: Environment Variables).
schema: 2
name: whoogle
kind: compose
title: "Whoogle Search"
slogan: "A self-hosted, ad-free, privacy-respecting metasearch engine."
description: "Google results without ads, JavaScript, AMP links, cookies or tracking, fetched by your server. Protected by a user name and a password Noust generates, so it is not an open proxy."
category: search
tags: [search, privacy, proxy, metasearch]
logo: logo.png
version: "1.2.4"
revision: 1
updated: 2026-10-30
homepage: https://pypi.org/project/whoogle-search/
docs: https://pypi.org/project/whoogle-search/
repository: https://github.com/benbusby/whoogle-search
license: MIT
architectures: ["amd64", "arm64"]
needs:
  - Docker Engine with the Compose plugin
port: 5000
variables:
  SEARCH_PASSWORD:
    generate: "password32"
    description: "The password of the user whoogle."
health: {path: /healthz, expect: "200", timeout: 120}
compose: |
  services:
    whoogle:
      image: benbusby/whoogle-search:1.2.4@sha256:6ae072238642b7e5860c8fa7f68cf06be797eb4e2278fc41d17d3b5e8a051eea
      restart: unless-stopped
      environment:
        WHOOGLE_USER: whoogle
        WHOOGLE_PASS: ${SEARCH_PASSWORD}
      ports:
        - 127.0.0.1:${PORT}:5000
notes:
  - "Open {{ url }}. Sign in as whoogle with the password in SEARCH_PASSWORD (noust env show {{ domain }} --unmask)."
