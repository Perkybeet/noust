id: investigate-dependency-fails
family: investigate
forms: [investigate]
title: The model finds a conflicting dependency in the build log of the latest failed deployment
seed:
  deployments:
    - app: shop.example.com
      status: success
      commit: 11aa22b
      branch: main
      message: Fix the footer
      log: |
        Build succeeded
    - app: shop.example.com
      status: failed
      error: "npm ERR! code ERESOLVE"
      commit: c7d11b0
      branch: upgrade-react
      message: Bump react to 19
      log: |
        > shop@1.4.2 build
        npm ERR! code ERESOLVE
        npm ERR! ERESOLVE unable to resolve dependency tree
        npm ERR! Found: react@19.0.0
        npm ERR! peer react@"^18.0.0" from react-datepicker@4.25.0
ask:
  message: What broke the build of the latest commit?
script:
  - call: {tool: list_deployments, arguments: {domain: shop.example.com, limit: 5}}
  - call: {tool: get_deployment, arguments: {deployment_id: "<<deployment:2>>"}}
  - call: {tool: deployment_log, arguments: {deployment_id: "<<deployment:2>>"}}
  - say: |
      The latest deployment failed to resolve its dependencies:
      [[S3:5]]
      Upgrade the date picker or keep React 18.
expect:
  state: done
  trace: [list_deployments, get_deployment, deployment_log]
  quotes: ['npm ERR! peer react@"^18.0.0" from react-datepicker@4.25.0']
  answer_contains: [React]
  proposals: []
