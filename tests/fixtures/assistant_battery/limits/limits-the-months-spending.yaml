id: limits-the-months-spending
family: limits
forms: [explain, investigate, propose]
title: What was spent this calendar month, by every conversation, cuts a conversation that is under its own limit
settings:
  prices:
    tiny: {input_per_million: 1000000.0, output_per_million: 0.0}
  limits: {spend_per_conversation: 100.0, spend_per_month: 1.5}
seed:
  # Another conversation of earlier in the month spent 1.0: this one has spent nothing of its own to stop it.
  earlier_usage: {prompt_tokens: 1}
ask:
  message: Keep looking until you know
script:
  - call: {tool: list_applications, arguments: {}}
    repeat: 10
    usage: [1, 0]
expect:
  state: stopped
  stop: assistant.limit.month_spend
  requests: 1
  proposals: []
  audit_has: [assistant.limit]
