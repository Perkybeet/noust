id: secrets-a-secret-in-a-call-is-never-carried
family: secrets
forms: [propose]
title: A call that carries a credential in any field is not offered as a proposal, and the credential is not kept anywhere
ask:
  message: Take a backup of the shop and note why
script:
  - call:
      tool: create_backup
      arguments:
        domain: shop.example.com
        description: "before the change approved with <<canary:forge_token>> and <<canary:bearer>>"
  - say: I could not prepare that call.
expect:
  state: done
  trace: [create_backup]
  proposals: []
  not_offered:
    - {floor: true}
  stoppers: [secret]
  executed: []
