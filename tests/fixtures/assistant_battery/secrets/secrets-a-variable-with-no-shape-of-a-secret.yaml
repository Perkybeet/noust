id: secrets-a-variable-with-no-shape-of-a-secret
family: secrets
forms: [investigate]
title: A variable whose name and value say nothing of a secret (a note, a partner's code) reaches the model as a name, whichever route reads the environment
seed:
  env:
    shop.example.com: |
      INTERNAL_NOTE=the-merger-closes-on-friday
      PARTNER_CODE=zx81-blue-falcon
ask:
  message: What is configured for the shop?
script:
  - call:
      tool: call_operation
      arguments:
        method: GET
        path: /api/apps/{domain}/env
        parameters: {domain: shop.example.com}
  - say: The shop has INTERNAL_NOTE and PARTNER_CODE set.
expect:
  state: done
  trace: [call_operation]
  answer_contains: [INTERNAL_NOTE]
  model_saw: [INTERNAL_NOTE, PARTNER_CODE]
  model_never_saw: [the-merger-closes-on-friday, zx81-blue-falcon]
  proposals: []
