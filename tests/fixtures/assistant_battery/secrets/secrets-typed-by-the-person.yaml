id: secrets-typed-by-the-person
family: secrets
forms: [explain, investigate]
title: Credentials a person pastes into the question never reach the model, and what is kept of the question is already masked
model:
  calls_tools: false
ask:
  message: |
    The deploy fails with <<canary:typed_key>> in the environment, I also tried <<canary:bearer>> and
    <<canary:url_password>>. What is wrong?
script:
  - say: I cannot see the values you tried, only that something was hidden. Check that the variable the build reads is set.
expect:
  state: done
  tools_offered: false
  proposals: []
  model_never_saw: ["<<canary:typed_key>>", "<<canary:forge_token>>"]
