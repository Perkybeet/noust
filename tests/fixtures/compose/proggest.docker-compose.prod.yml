# ============================================================
# Docker Compose - Producción
# ============================================================
# Uso:
#   docker-compose -f docker-compose.prod.yml build
#   docker-compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  # --------------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: proggest-postgres
    # Rotación de logs como en backend y frontend. Se aplica cuando se recree el
    # contenedor (deploy.sh no recrea la base ni Redis).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    environment:
      POSTGRES_USER: proggest
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: proggest
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - proggest-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proggest -d proggest']
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Redis 7
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: proggest-redis
    # Rotación de logs como en backend y frontend. Se aplica cuando se recree el
    # contenedor (deploy.sh no recrea la base ni Redis).
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - proggest-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Backend (NestJS)
  # --------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/erp-backend/Dockerfile
      args:
        # Mapas de fuentes a Sentry (solo si hay token) y versión con que se etiquetan.
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    container_name: proggest-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://proggest:${DB_PASSWORD}@postgres:5432/proggest
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      # Un origen por subdominio de producto (infra/nginx/modulos.proggest.es).
      # partestrabajo no hace falta: redirige a partes.
      CORS_ORIGIN: https://proggest.es,https://timpora.proggest.es,https://partes.proggest.es,https://gestordoc.proggest.es,https://uaap.proggest.es
      # Llaves de acceso (passkeys): el dominio de las llaves y los orígenes desde
      # los que se aceptan. Con proggest.es, una llave vale en todos los subdominios.
      PASSKEY_RP_ID: proggest.es
      PASSKEY_ORIGINS: https://proggest.es,https://www.proggest.es,https://timpora.proggest.es,https://partes.proggest.es,https://gestordoc.proggest.es,https://uaap.proggest.es
      BULL_BOARD_USER: ${BULL_BOARD_USER:-admin}
      BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      FRONTEND_URL: https://proggest.es
      # URL pública para los QR de verificación de documentos (/verificar/:code).
      # Dominio canónico único: un solo backend sirve todos los vhosts y
      # /verificar/:code resuelve igual desde cualquiera de ellos.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://proggest.es}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      # Cifra las credenciales de SharePoint. Opcional: sin ella el backend
      # arranca y configurar o sincronizar SharePoint responde 503. Si se
      # define, tiene que ser hexadecimal de 64 caracteres o el backend no arranca.
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      # Cifra el IBAN de la ficha de personal. Obligatoria: sin ella el backend
      # no arranca (IbanProtectionService.onModuleInit) y entra en crash-loop.
      PERSONNEL_ENCRYPTION_KEY: ${PERSONNEL_ENCRYPTION_KEY:?PERSONNEL_ENCRYPTION_KEY requerido - definir en .env}
      STORAGE_TYPE: ${STORAGE_TYPE:-s3}
      AWS_REGION: ${AWS_REGION:-eu-south-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-proggest-storage-prod}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      # Versión que etiqueta los errores (proggest@X.Y.Z); la exporta deploy.sh.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Clave compartida frontend<->backend para POST /auth/oauth-login, que está
      # detrás de InternalApiGuard. Tiene que estar en LOS DOS servicios con el mismo
      # valor: al frontend le falta la cabecera si no la tiene y el backend responde
      # 403, así que dársela solo a uno deja el login con Google igual de roto.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - '${DOCKER_GID:-999}'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - proggest-network
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --------------------------------------------------------
  # Frontend (Next.js)
  # --------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/web-gateway/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://proggest.es/api/v1
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-0.12.0}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        # Sin ella el Dockerfile corta el build: ver el comentario allí
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    container_name: proggest-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: https://proggest.es
      AUTH_TRUST_HOST: 'true'
      AUTH_COOKIE_DOMAIN: .proggest.es
      NEXT_PUBLIC_API_URL: https://proggest.es/api/v1
      API_GATEWAY_URL: http://backend:3000/api/v1
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_MICROSOFT_ID: ${AUTH_MICROSOFT_ID:-}
      AUTH_MICROSOFT_SECRET: ${AUTH_MICROSOFT_SECRET:-}
      AUTH_MICROSOFT_TENANT_ID: ${AUTH_MICROSOFT_TENANT_ID:-common}
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Mismo valor que en el backend: sin ella, `lib/auth/auth.ts` omite en silencio
      # la cabecera X-Internal-Api-Key y el login con Google muere en un 403.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    healthcheck:
      # `docker ps` decía «Up» desde el instante en que arrancaba el proceso,
      # aunque Next.js tardara otros diez segundos en atender.
      #
      # `127.0.0.1` y no `localhost`: dentro del contenedor ese nombre resuelve
      # primero a `::1` y Next solo escucha en IPv4, así que la comprobación
      # moría con «connection refused» y marcaba el contenedor como enfermo
      # estando perfectamente. Y `/api/health`, no la raíz, que contesta con un
      # 307 a /login y deja el resultado a merced de cómo trate wget la
      # redirección.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - proggest-network

networks:
  proggest-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
