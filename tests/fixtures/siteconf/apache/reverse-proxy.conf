# Reverse proxy with a balancer, ordered ProxyPass rules and Location sections.
<Proxy "balancer://appcluster">
    BalancerMember "http://10.0.0.21:8080" loadfactor=1
    BalancerMember "http://10.0.0.22:8080" loadfactor=2 status=+H
    ProxySet lbmethod=byrequests
</Proxy>

<VirtualHost *:80>
    ServerName app.example.com
    ServerAlias www.app.example.com *.app.example.net
    Redirect permanent / https://app.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName app.example.com
    ServerAlias www.app.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/app.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app.example.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    LimitRequestBody 10485760
    Header always set Strict-Transport-Security "max-age=63072000"

    ProxyPreserveHost On
    ProxyRequests Off

    # The first matching ProxyPass wins, so the longer paths come first.
    ProxyPass /static !
    ProxyPass /api/v2/ http://127.0.0.1:9002/ \
              timeout=120 \
              keepalive=On
    ProxyPassReverse /api/v2/ http://127.0.0.1:9002/
    ProxyPass /api/ http://127.0.0.1:9001/
    ProxyPassReverse /api/ http://127.0.0.1:9001/
    ProxyPassMatch "^/ws/(.*)$" "ws://127.0.0.1:9003/$1"
    ProxyPass / balancer://appcluster/
    ProxyPassReverse / balancer://appcluster/

    Alias /static /srv/app/static
    <Directory /srv/app/static>
        Require all granted
    </Directory>

    <Location "/admin">
        AuthType Basic
        AuthName "Restricted"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Location>

    <LocationMatch "^/api/v[0-9]+/internal/">
        Require ip 10.0.0.0/8
    </LocationMatch>

    <Location /health>
        ProxyPass http://127.0.0.1:9001/health
        Require all granted
    </Location>

    <If "%{HTTP_HOST} == 'www.app.example.com'">
        Redirect permanent / https://app.example.com/
    </If>

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:9001/$1 [P,L]
</VirtualHost>
