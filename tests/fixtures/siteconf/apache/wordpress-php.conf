Define SITE_ROOT /var/www/wordpress

<VirtualHost 192.0.2.10:80 [2001:db8::10]:80>
  ServerName blog.example.com
  DocumentRoot ${SITE_ROOT}

  <Directory ${SITE_ROOT}>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted

    <IfModule mod_rewrite.c>
      RewriteEngine On
      RewriteBase /
      RewriteRule ^index\.php$ - [L]
      RewriteCond %{REQUEST_FILENAME} !-f
      RewriteCond %{REQUEST_FILENAME} !-d
      RewriteRule . /index.php [L]
    </IfModule>
  </Directory>

  <FilesMatch \.php$>
    SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
  </FilesMatch>

  <Files "xmlrpc.php">
    Require all denied
  </Files>

  Header set X-Note "a \"quoted\" value"
  SetEnvIf Request_URI "^/wp-admin" admin_area=1

  ErrorDocument 404 "Sorry, that page does not exist"
</VirtualHost>
