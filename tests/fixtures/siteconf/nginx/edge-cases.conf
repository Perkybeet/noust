	# Tabs, odd spacing and every quoting form the tokenizer has to keep.
server{
listen   80;listen [::]:80 ipv6only=on;   # two directives on one line
	server_name example.com .example.org *.example.net mail.* ~^(?<user>[a-z0-9-]+)\.users\.example\.com$ "";
	set $greeting "hello \"quoted\" world";
	set $single 'it\'s fine';
	set $braced "${greeting}-${single}";
	set $word ${greeting}suffix;
	set $escaped back\;slash\ space;
	set $hash value#not-a-comment;
	add_header X-Json "{\"ok\": true, \"list\": [1, 2]}";
	return_codes_unused_directive 1
	                              2   # a comment between arguments
	                              3;

	location ~ "^/a{2}/(?<rest>.*)$" {
		return 200 "matched $rest\n";
	}

	location ~* \.(gif|jpg|png)$ {}

	location =/exact { return 204; }

	location ^~/images/ {
		root /data;
	}

	location @fallback{
		proxy_pass http://127.0.0.1:8080;
	}

	location / {
		error_page 404 = @fallback;
		if ($http_user_agent ~ (MSIE|Trident)) { return 403; }
		if ($request_uri ~* "^[^?]*(\.\.|%2e)") {
			return 400;
		}
		try_files $uri $uri/ =404;   }

	location /multi {
		proxy_pass
			http://127.0.0.1:9000
		;
		add_header
			Cache-Control
			"no-store"
			always;
	}
}
# a last comment without a newline at the end of the file