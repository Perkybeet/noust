# Load balancing in front of several pools, with servers that come from files
# Noust rewrites on every activation and from glob includes.

upstream web_pool {
    zone web_pool 64k;
    least_conn;
    server 10.0.0.11:8080 weight=5 max_fails=3 fail_timeout=30s;
    server 10.0.0.12:8080 weight=1;
    server app3.internal:8080 backup;
    server unix:/run/app/web.sock;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream wasm_bg_shop_web {
    include /etc/nginx/noust-upstreams/shop/web.servers;
    keepalive 8;
}

upstream "quoted_pool" {
    hash $request_uri consistent;
    server 10.0.1.1:9000;
    server 10.0.1.2:9000 down;
}

include /etc/nginx/conf.d/*.conf;

server {
    listen 8080;
    listen 127.0.0.1:8081 default_server;
    listen unix:/run/nginx/lb.sock;
    server_name lb.example.com
                lb-alt.example.com
                *.lb.example.com;

    include snippets/*.conf;
    include "snippets/headers with space.conf";

    location / {
        proxy_pass http://web_pool;
        proxy_next_upstream error timeout http_502;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /shop/ {
        proxy_pass http://wasm_bg_shop_web/;
    }

    location /legacy {
        proxy_pass http://quoted_pool;
    }

    location /direct/ {
        proxy_pass http://127.0.0.1:9100/v2/;
    }

    location /grpc.Service/ {
        grpc_pass grpc://127.0.0.1:50051;
    }
}
