limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $host $site_backend {
    hostnames;
    default            127.0.0.1:3000;
    .example.com       127.0.0.1:3001;   # every subdomain
    ~^api\d+\.example\.net$ 127.0.0.1:3002;
    "~*^(?<sub>[a-z]+)\.example\.org$" 127.0.0.1:3003;
    include /etc/nginx/maps/*.map;
}

map $request_uri $deprecated {
    volatile;
    default 0;
    ~^/v1/  1;
}

geo $remote_addr $is_office {
    default        0;
    127.0.0.1      1;
    10.0.0.0/8     1;
    192.168.0.0/16 1;
    2001:db8::/32  1;
}

geo $limited {
    ranges;
    default 1;
    10.0.0.1-10.0.0.255 0;
}

split_clients "${remote_addr}AAA" $variant {
    0.5%  .one;
    20.0% .two;
    *     "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    if ($is_office = 0) {
        set $deny_admin 1;
    }

    if ($http_user_agent ~* (bot|crawler|spider)) {
        return 403;
    }

    location /admin/ {
        if ($deny_admin) {
            return 403;
        }
        limit_req zone=login burst=5;
        limit_conn perip 10;
        proxy_pass http://$site_backend;
    }

    location / {
        if ($deprecated) {
            add_header Deprecation "true";
        }
        if (-f $request_filename) {
            break;
        }
        if ($request_method !~ ^(GET|HEAD|POST)$ ) {
            return 405;
        }
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://$site_backend$variant;
    }
}
