# OpenResty site with inline Lua: braces inside Lua strings, long brackets and
# comments must not end the block early.
lua_shared_dict limits 10m;
lua_package_path "/usr/local/openresty/lualib/?.lua;;";

init_by_lua_block {
    local cjson = require "cjson.safe"
    -- a comment with a closing brace } that is not code
    TEMPLATE = [[
      { "status": "ok", "nested": { "a": 1 } }
    ]]
    LEVEL2 = [==[ ]] still inside } ]==]
    --[[ block comment with } and { inside ]]
    PATTERNS = { "^/api/", '^/static/{2}', "quote \" and brace }" }
}

upstream app_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name lua.example.com;

    set_by_lua_block $request_tag {
        local tag = ngx.var.http_x_tag or "{none}"
        return tag
    }

    location /hello {
        default_type text/plain;
        content_by_lua_block {
            local name = ngx.var.arg_name or "world"
            ngx.say(string.format("{\"hello\": \"%s\"}", name))
            if name == "}" then ngx.exit(400) end
        }
    }

    location /api/ {
        access_by_lua_block {
            local limits = ngx.shared.limits
            local key = "rate:" .. ngx.var.remote_addr
            local count = limits:incr(key, 1, 0, 60)
            if count and count > 100 then
                return ngx.exit(429) -- too many }
            end
        }
        header_filter_by_lua_block { ngx.header["X-Served-By"] = "lua" }
        proxy_pass http://app_backend;
    }

    location = /status {
        content_by_lua_block { ngx.say('{"up":true}') }
    }
}
