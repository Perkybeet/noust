# generated 2024-01-01, Mozilla Guideline v5.7, nginx 1.25, modern configuration
# https://ssl-config.mozilla.org/
load_module modules/ngx_http_brotli_filter_module.so;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;
    server_name www.example.com example.com;

    ssl_certificate /path/to/signed_cert_plus_intermediates;
    ssl_certificate_key /path/to/private_key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions
    ssl_session_tickets off;

    # modern configuration
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (ngx_http_headers_module is required) (63072000 seconds)
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # verify chain of trust of OCSP response using Root CA and Intermediate certs
    ssl_trusted_certificate /path/to/root_CA_cert_plus_intermediates;

    # replace with the IP address of your resolver
    resolver 127.0.0.1 [::1] valid=300s ipv6=off;

    # Third-party modules: headers-more, brotli, sub_filter.
    more_set_headers "Server: edge";
    more_clear_headers X-Powered-By;
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript;
    gzip_static on;
    open_file_cache max=1000 inactive=20s;

    root /srv/www/example;

    location / {
        sub_filter '</head>' '<link rel="preconnect" href="https://cdn.example.com"></head>';
        sub_filter_once on;
        try_files $uri $uri/index.html =404;
    }

    location ~* \.(?:css|js|woff2)$ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    location /downloads/ {
        alias /srv/downloads/;
        autoindex on;
        limit_rate_after 10m;
        limit_rate 512k;
    }
}
