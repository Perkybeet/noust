# Apache reverse proxy configuration for shop.example.com
# Generated by Noust

# Do not announce the Apache version or the modules in headers and error pages.
# Server-wide, so every site file says the same thing.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName shop.example.com
    ServerAdmin webmaster@shop.example.com

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/shop.example.com.error.log
    CustomLog ${APACHE_LOG_DIR}/shop.example.com.access.log combined

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests Off
    
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    # Timeouts
    ProxyTimeout 60
</VirtualHost>