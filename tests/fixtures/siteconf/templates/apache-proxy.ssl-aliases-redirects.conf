# Apache reverse proxy configuration for shop.example.com
# Generated by Noust

# Do not announce the Apache version or the modules in headers and error pages.
# Server-wide, so every site file says the same thing.
ServerTokens Prod
ServerSignature Off

# old-shop.example.com redirects permanently to shop.example.com
<VirtualHost *:80>
    ServerName old-shop.example.com
    DocumentRoot /var/www/html

    # Everything but the ACME challenge (webroot method) goes to the primary
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://shop.example.com%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName old-shop.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/shop.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shop.example.com/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    RewriteEngine On
    RewriteRule ^ https://shop.example.com%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:80>
    ServerName shop.example.com
    ServerAlias www.shop.example.com
    ServerAdmin webmaster@shop.example.com

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName shop.example.com
    ServerAlias www.shop.example.com
    ServerAdmin webmaster@shop.example.com

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/shop.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/shop.example.com/privkey.pem
    
    # SSL Settings
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/shop.example.com.error.log
    CustomLog ${APACHE_LOG_DIR}/shop.example.com.access.log combined

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests Off
    
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    # Timeouts
    ProxyTimeout 60
</VirtualHost>