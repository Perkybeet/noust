# Advanced Nginx configuration for multi.example.com
# Generated by Noust - Multi-route reverse proxy

limit_req_zone $binary_remote_addr zone=global:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=zone_api:10m rate=10r/s;

upstream web {
    server 127.0.0.1:3001;
}
upstream api {
    server 127.0.0.1:3002;
}

server {
    listen 80;
    listen [::]:80;
    server_name multi.example.com;
    server_tokens off;

    # ACME challenge location for Let's Encrypt (webroot method)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }


    # Logging
    access_log /var/log/nginx/multi.example.com.access.log;
    error_log /var/log/nginx/multi.example.com.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 50m;
    proxy_intercept_errors on;

    # Route: /api/ -> api:3002
    location /api/ {
        limit_req zone=zone_api burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;


        # Timeouts
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Route: /socket.io -> api:3002
    location /socket.io {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Custom buffer settings
        proxy_buffer_size 256k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Route: / -> web:3001
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;


        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

}