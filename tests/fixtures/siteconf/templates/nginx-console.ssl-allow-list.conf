# Noust console site for console.example.com
# Generated by Noust ('noust console expose'); remove it with 'noust console unexpose'.
#
# The console runs on 127.0.0.1:8080. This site is the only thing that
# publishes it, over TLS, and nothing here is ever served over plain HTTP but
# the certificate challenge and the redirect to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name console.example.com;
    server_tokens off;

    # ACME challenge location for Let's Encrypt (webroot method). Open to
    # everyone: the certificate authority is not on the allow-list.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    access_log /var/log/nginx/console.example.com.access.log;
    error_log /var/log/nginx/console.example.com.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Who may reach the console. Everyone else is refused here, before the
    # console sees the request: it is root-equivalent, and a sign-in form is
    # not a reason to let the whole internet try it.
    allow 203.0.113.0/24;
    allow 2001:db8::/32;
    deny all;

    # Uploads (an exported application, a restored dump) can be large.
    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # The console believes these only from 127.0.0.1 (--trusted-proxy), and this
        # is the first hop: what a client sent in X-Forwarded-For is replaced, never
        # appended to, so nobody can pick the address the rate limit and the
        # lockout are keyed on.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The log and job WebSockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        # The /events stream stays open for as long as a page does, and a log
        # follows a process for as long as it runs.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}