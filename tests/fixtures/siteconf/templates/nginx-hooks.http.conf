# Noust hooks site for hooks.example.com: only /hooks/ reaches the console
# Generated by Noust ('noust web expose-hooks'); every other path answers 404.

server {
    listen 80;
    listen [::]:80;
    server_name hooks.example.com;
    server_tokens off;

    # ACME challenge location for Let's Encrypt (webroot method)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }


    access_log /var/log/nginx/hooks.example.com.access.log;
    error_log /var/log/nginx/hooks.example.com.error.log;

    add_header X-Content-Type-Options "nosniff" always;

    # GitHub delivers payloads of up to 25 MB; the console caps what it reads.
    client_max_body_size 26m;

    # Only the webhook surface: never the console, its API or its sign-in.
    location /hooks/ {
        # nginx matched the normalised path; a raw one that needed normalising
        # (/api/x/../../hooks/y, %2e, %2f, %5c) is never a delivery.
        if ($request_uri ~* "^[^?]*(\.\.|%2e|%2f|%5c)") {
            return 400;
        }
        # The URI makes nginx forward the path it normalised and matched,
        # not the raw request line, which the console would route elsewhere.
        proxy_pass http://127.0.0.1:8080/hooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}