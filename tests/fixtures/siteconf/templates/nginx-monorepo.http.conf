# Nginx configuration for mono.example.com (Monorepo)
# Generated by Noust

# Upstream backends for each workspace
upstream web_app_backend {
    server 127.0.0.1:3001;
}
upstream api_backend {
    server 127.0.0.1:3002;
}

# HTTP server for ACME challenges and redirects
server {
    listen 80;
    listen [::]:80;
    server_name mono.example.com app.mono.example.com api.mono.example.com ;
    server_tokens off;

    # ACME challenge location for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # HTTP-only configuration (no SSL)
    # Route based on Host header
    # web-app on app.mono.example.com
    set $backend_web_app 0;
    if ($host = "app.mono.example.com") {
        set $backend_web_app 1;
    }
    # api on api.mono.example.com
    set $backend_api 0;
    if ($host = "api.mono.example.com") {
        set $backend_api 1;
    }

    location @web_app {
        proxy_pass http://web_app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location @api {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        if ($host = "app.mono.example.com") {
            proxy_pass http://web_app_backend;
        }
        if ($host = "api.mono.example.com") {
            proxy_pass http://api_backend;
        }
    }
}
