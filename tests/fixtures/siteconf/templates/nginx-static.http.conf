# Nginx static site configuration for docs.example.com
# Generated by Noust

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;
    server_tokens off;

    # ACME challenge location for Let's Encrypt (webroot method). ^~ stops
    # nginx from even considering the hidden-files regex below for this
    # path: a plain prefix location loses to any matching regex location,
    # checked in file order, and ".well-known" itself starts with a dot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }


    # Document root
    root /var/www/apps/docs-example-com/current;
    index index.html index.htm;

    # Logging
    access_log /var/log/nginx/docs.example.com.access.log;
    error_log /var/log/nginx/docs.example.com.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA support - try files then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Other well-known resources (security.txt, apple-app-site-association,
    # a renewal's ACME check, ...) must stay reachable too: ^~ here keeps
    # this whole prefix out of the hidden-files regex below, the same way
    # the acme-challenge location above does.
    location ^~ /.well-known/ {
    }

    # Deny access to hidden files and directories, except /.well-known/ above.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}