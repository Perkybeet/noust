# Nginx static site configuration for docs.example.com
# Generated by Noust

# www.docs.example.com redirects permanently to docs.example.com
server {
    listen 80;
    listen [::]:80;
    server_name www.docs.example.com;
    server_tokens off;

    # ACME challenge location for Let's Encrypt (webroot method)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://docs.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.docs.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://docs.example.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;
    server_tokens off;

    # ACME challenge location for Let's Encrypt (webroot method). ^~ stops
    # nginx from even considering the hidden-files regex below for this
    # path: a plain prefix location loses to any matching regex location,
    # checked in file order, and ".well-known" itself starts with a dot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect HTTP to HTTPS (except ACME challenges)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.example.com;
    server_tokens off;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;
    
    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Document root
    root /var/www/apps/docs-example-com/current/dist;
    index index.html index.htm;

    # Logging
    access_log /var/log/nginx/docs.example.com.access.log;
    error_log /var/log/nginx/docs.example.com.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA support - try files then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Other well-known resources (security.txt, apple-app-site-association,
    # a renewal's ACME check, ...) must stay reachable too: ^~ here keeps
    # this whole prefix out of the hidden-files regex below, the same way
    # the acme-challenge location above does.
    location ^~ /.well-known/ {
    }

    # Deny access to hidden files and directories, except /.well-known/ above.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}