# Overlay on ../web: the same web service, and a PostgreSQL next to it. The official image with
# the credentials in its environment is what Noust detects to copy the database before an update.
services:
  web:
    build: .
    ports:
      - "@PORT@:8080"
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: it-secret-do-not-leak-0123456789
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  data: {}
  pgdata: {}
