# The rate-limit zones Proggest's site uses. On its server they live in the http{} block of
# the host's nginx.conf, not in infra/nginx/ (docs/operaciones/despliegue.md); here they go in
# conf.d, which Ubuntu's nginx.conf includes inside http{}. Generous enough that the harness's
# probe (5 requests a second on /api/) is never the one being limited.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=50r/s;
# The queues dashboard's own zone (10 r/s, burst 120 in the site): added to Proggest's site after
# this harness was written, and defined on its server in nginx.conf like the two above.
limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;
